    if(w.life<=0||w.x<A.x+4||w.x>A.x+A.w-4)waves.splice(i,1);
  }
  for(let i=seeds.length-1;i>=0;i--){
    const s=seeds[i];s.life-=dt;s.vy+=520*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;
    let dead=s.life<=0;
    if(s.x<A.x+8){s.x=A.x+8;s.vx=Math.abs(s.vx)}
    if(s.x>A.x+A.w-8){s.x=A.x+A.w-8;s.vx=-Math.abs(s.vx)}
    if(s.y>=A.roof-4){
      s.y=A.roof-4;
      if(s.b>=3)dead=true;
      else{s.b++;s.vy=-Math.max(170,Math.abs(s.vy)*.85);sfx(300+s.b*80,.05,'sine',.03,100)}
    }
    if(!dead&&s.x>P.x-4&&s.x<P.x+P.w+4&&s.y>P.y-4&&s.y<P.y+P.h+4){hurtPlayer(20,s.x);dead=true}
    if(dead){burst(s.x,s.y,5,'#c8f560',60,.3);seeds.splice(i,1)}
  }
  let inPoison=false;
  for(let i=puddles.length-1;i>=0;i--){
    const p=puddles[i];p.t+=dt;
    if(p.t>.5&&overlapR(P,{x:p.x,y:A.roof-14,w:p.w,h:14}))inPoison=true;
    if(p.t>=p.life)puddles.splice(i,1);
  }
  if(inPoison){
    P.poisonT-=dt;
    if(P.poisonT<=0&&P.inv<=0&&P.dashT<=0){hurtPlayer(10,P.x+5,true);P.poisonT=2;toast(t('t.poison'),1)}
  }else P.poisonT=0;
  for(let i=thorns.length-1;i>=0;i--){
    const t=thorns[i];t.t+=dt;
    if(t.t>=.9&&t.t<1.25&&!t.done&&overlapR(P,{x:t.x,y:A.roof-64,w:16,h:64})){t.done=true;hurtPlayer(20,t.x+8)}
    if(t.t===dt||(t.t>=.9&&t.t-dt<.9))sfx(220,.15,'sawtooth',.04,200);
    if(t.t>1.5)thorns.splice(i,1);
  }
}

function makeForest(wid,hei,seed,minH,maxH,cr){
  const c=document.createElement('canvas');c.width=wid;c.height=hei;const g=c.getContext('2d'),r=mulberry32(seed);
  g.fillStyle='#fff';
  let x=50;
  while(x<wid-60){
    const h=minH+r()*(maxH-minH),tw=6+Math.floor(r()*6),rad=cr*(.7+r()*.6);
    g.fillRect(x,hei-h,tw,h);
    for(let k=0;k<5;k++){g.beginPath();g.arc(x+tw/2+(r()-.5)*rad*1.6,hei-h-(r()*.5)*rad+rad*.2,rad*(.6+r()*.5),0,6.283);g.fill()}
    x+=tw+20+Math.floor(r()*44);
  }
  return c;
}

function updateP3(dt){
  updateHz(dt);
  for(let i=flasks.length-1;i>=0;i--){
    const f=flasks[i];f.t+=dt;f.vy+=520*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;
    const s=f.vy>0?solidAt(f.x,f.y+3):null;
    if(s){pools.push({x:f.x-14,y:s.y-5,w:28,h:5,t:3,cd:0,dk:f.dk,lt:f.lt});burst(f.x,s.y-2,10,f.lt||'#7dff7a',70,.4);sfx(240,.15,'triangle',.05,-100);flasks.splice(i,1)}
    else if(f.y>WH+40||f.t>4||solidAt(f.x,f.y))flasks.splice(i,1);
  }
  for(let i=pools.length-1;i>=0;i--){
    const p=pools[i];p.t-=dt;p.cd-=dt;
    if(p.cd<=0&&overlapR({x:p.x,y:p.y-4,w:p.w,h:p.h+4},P)){p.cd=1;hurtPlayer(10,p.x+p.w/2,true)}
    if(p.t<=0)pools.splice(i,1);
  }
  for(let i=missiles.length-1;i>=0;i--){
    const m=missiles[i];m.t+=dt;
    const a=Math.atan2((P.y+6)-m.y,(P.x+5)-m.x);
    let da=a-m.a;while(da>Math.PI)da-=6.283;while(da<-Math.PI)da+=6.283;
    m.a+=clamp(da,-2.6*dt,2.6*dt);
    m.x+=Math.cos(m.a)*105*dt;m.y+=Math.sin(m.a)*105*dt;
    const dx=(P.x+5)-m.x,dy=(P.y+6)-m.y,near=dx*dx+dy*dy<9*9;
    if(m.t>=2||near||(m.t>.3&&pointSolid(m.x,m.y))){
      if(dx*dx+dy*dy<26*26)hurtPlayer(m.dmg||20,m.x);
      burst(m.x,m.y,16,'#ff6a3d',130,.4);burst(m.x,m.y,8,'#fff2c0',80,.3);sfx(110,.2,'sawtooth',.06,-40);
      pboom.push({x:m.x,y:m.y,t:.25,small:1});
      missiles.splice(i,1);
    }
  }
  for(let i=shocks.length-1;i>=0;i--){
    const w=shocks[i];w.x+=w.vx*dt;w.life-=dt;
    if(overlapR({x:w.x-7,y:w.y-12,w:14,h:12},P))hurtPlayer(w.dmg||30,w.x);
    if(w.life<=0||!pointSolid(w.x,w.y+3)||pointSolid(w.x,w.y-4))shocks.splice(i,1);
  }
  for(let i=orbs.length-1;i>=0;i--){
    const o=orbs[i];o.t+=dt;
    if(o.t>=1.7&&!o.done){
      o.done=true;
      const dx=(P.x+5)-o.tx,dy=(P.y+6)-o.ty;
      if(dx*dx+dy*dy<32*32)hurtPlayer(20,o.tx);
      burst(o.tx,o.ty,24,'#b58cff',160,.5);burst(o.tx,o.ty,10,'#fff',90,.3);G.shake=Math.max(G.shake,.2);sfx(90,.3,'sawtooth',.07,-30);
    }
    if(o.t>=2)orbs.splice(i,1);
  }
  for(let i=enemies.length-1;i>=0;i--)if(enemies[i].y>WH+200&&enemies[i].minion)enemies.splice(i,1);
  /* World 3 great door */
  const g=world.gate;
  if(g&&boss.dead&&!Hell.on&&overlapR(P,g)){
    if(G.card)startCut('door');
    else if(G.toastT<=0)toast(t('t.needcard'),1.5);
  }
}

function tramDeath(dt){

  else if(B.state==='punch'){fh=T<.75?[fx-f*16,shY+8]:[fx+f*46,shY+2]}
  else if(B.state==='dash'){fh=[fx-f*14,shY+8];bh=[bx-f*14,shY+4]}

function addSecret(S){
  const cb=S.checks.find(c=>c.id==='cb');
  const ap=cb&&S.buildings.find(b=>b.x<=cb.x&&cb.x<b.x+b.w);
  if(!ap){S.secret=null;return}
  const RX=S.endX+10*T,FY=16*T,CY=7*T;
  const rects=[
    {x:RX,y:FY,w:24*T,h:(ROWS-FY/T)*T,kind:'floor'},
    {x:RX,y:0,w:24*T,h:CY,kind:'ceil'},
    {x:RX-T,y:0,w:T,h:ROWS*T,kind:'wall'},
    {x:RX+24*T,y:0,w:T,h:ROWS*T,kind:'wall'}];
  for(const r of rects)S.solids.push(r);
  const tramp={x:RX+5*T,y:FY-8,w:2*T,h:8,tramp:true,kind:'tramp',sq:0,secretTramp:true};
  S.solids.push(tramp);S.specials.push(tramp);
  S.secret={x:RX,camY:FY-176,floor:FY,ceil:CY,gx0:ap.x-2*T-6,gx1:ap.x+6,ap:ap,rects:rects,tramp:tramp,scope:{x:RX+16*T,y:FY}};
}

function whipRect(w){const L=whipLen(w),hx=P.x+5+w.face*6;return{x:w.face>0?hx:hx-L,y:P.y+2,w:L,h:9}}
function updateWhips(dt){
  for(let i=whips.length-1;i>=0;i--){
    const w=whips[i];w.t+=dt;
    if(w.t>.22||P.dead){whips.splice(i,1);continue}
    const r=whipRect(w);if(r.w<4)continue;
    const hitFx=(x,y)=>{burst(x,y,6,'#9b5de5',80,.3);sfx(420,.05,'square',.03,-200)};
    for(const e of enemies.slice()){if(e.spawnT>0||w.hit.has(e)||!overlapR(r,e))continue;w.hit.add(e);hitEnemy(e,w.dmg);hitFx(e.x+e.w/2,e.y+e.h/2)}
    if(mini&&mini.active&&!mini.dead&&mini.hp>0&&!w.hit.has(mini)&&overlapR(r,mini)){w.hit.add(mini);mini.hp-=w.dmg;mini.flash=.1;hitFx(r.x+(w.face>0?r.w:0),r.y+4)}
    if(boss.active&&!boss.dead&&boss.hp>0&&!w.hit.has(boss)&&bossHit(r)){w.hit.add(boss);boss.hp-=w.dmg;boss.flash=.1;hitFx(r.x+(w.face>0?r.w:0),r.y+4)}
    for(const s of world.specials)if(s.brk&&!s.broken&&!w.hit.has(s)&&overlapR(r,s)){w.hit.add(s);brkHit(s,w.dmg)}
  }
}
function drawWhips(cx,cy){

    const L=whipLen(w);if(L<2)continue;
    const hx=P.x+5+w.face*6-cx,hy=P.y+6-cy;

}

function secretFight(){return!!(boss&&!boss.dead&&boss.active&&(boss.kind==='bonez'||boss.kind==='tram'||boss.kind==='duo'))}
/* bosses already beaten in Pantheon, in the order they sit in the stand */
function hellBench(){
  if(!Hell.on||!boss)return[];
  if(boss.kind==='duo')return['colossus','flora','centaur','unity'];
  const order=['colossus','flora','centaur','bonez','unity'];
  let n=[0,1,2,4][Hell.i]||0;
  if(boss.kind==='bonez'||boss.kind==='tram')n++;
  if(boss.dead)n++;
  return order.slice(0,Math.min(5,n));
}

function drawDivineLight(){

  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  }
  for(let i=0;i<26;i++){
    const ph=(NOW*.12+hash2(i,401))%1,x=hash2(i,402)*W+Math.sin(NOW+i)*6,y=ph*H;

  if(boss&&boss.kind==='duo'){

let tcirc=[];
function updateCirc(dt){
  const A=world.arena;if(!A)return;
  if(P.slowT>0)P.slowT-=dt;
  for(let i=tcirc.length-1;i>=0;i--){
    const o=tcirc[i];
    if(o.k==='ball'){
      o.vy+=700*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;o.rot+=o.vx*dt/o.r;
      if(o.y+o.r>=A.roof&&o.vy>0){o.y=A.roof-o.r;o.vy=-Math.max(170,Math.abs(o.vy)*.78);sfx(150,.08,'square',.03,-60)}
      const dx=(P.x+5)-o.x,dy=(P.y+6)-o.y;
      if(!o.hit&&dx*dx+dy*dy<(o.r+6)*(o.r+6)){o.hit=true;hurtPlayer(25,o.x)}
      if(o.x<A.lx-30||o.x>A.rx+30)tcirc.splice(i,1);
    }else if(o.k==='hoop'){
      o.x+=o.vx*dt;
      if(!o.hit&&!o.pass&&Math.abs(P.x+5-o.x)<6){
        const top=o.y-o.r+4,bot=o.y+o.r-4;
        if(P.y<top||P.y+P.h>bot){o.hit=true;hurtPlayer(20,o.x)}
        else{o.pass=true;sfx(880,.15,'triangle',.05,400);burst(o.x,o.y,10,'#ffd23f',90,.4)}
      }
      if(o.x<A.lx-30||o.x>A.rx+30)tcirc.splice(i,1);
    }else if(o.k==='pie'){
      o.vy+=600*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;
      if(o.x>P.x-3&&o.x<P.x+P.w+3&&o.y>P.y-3&&o.y<P.y+P.h+3){hurtPlayer(10,o.x);P.slowT=2;burst(o.x,o.y,10,'#fff8f0',80,.4);tcirc.splice(i,1);continue}
      if(o.y>=A.roof-3){tcirc.splice(i,1);tcirc.push({k:'cream',x:o.x,w:22,t:4});burst(o.x,A.roof-3,8,'#fff8f0',70,.3);sfx(200,.1,'triangle',.04,-100)}
    }else if(o.k==='cream'){
      o.t-=dt;
      if(P.ground&&Math.abs(P.x+5-o.x)<o.w/2+3&&Math.abs(P.y+P.h-A.roof)<3)P.slowT=Math.max(P.slowT||0,.35);
      if(o.t<=0)tcirc.splice(i,1);
    }
  }
}

function duoSchedule(dt,ts,fall){
  const D=boss,T=D.T,Z=D.Z,cur=D.cur;
  Z.beamT=Math.max(0,Z.beamT-dt);
  D.cd-=dt*ts;
  if(!(!cur||cur.state==='idle'||cur.t>=cur.hand)||D.cd>0)return;
  const X=D.turn%2===0?T:Z;if(X.state!=='idle')return;
  const set=X===T?(fall?['juggleF','hoopsF','diveF']:['dash','juggle','cannon','hoops','pies','scarf']):(fall?['boltsF','tentF']:['gears','spikes','bolts','bombs','rain','whip']);
  if(X===Z&&Z.beamT<=0)set.push(fall?'beamF':'beam');
  let a;do{a=set[Math.floor(Math.random()*set.length)]}while(a===X.last&&Math.random()<.85);
  duoStart(X,a,fall);D.cur=X;D.turn++;D.cd=fall?.15:(ts>1?.15:.3);
}

function frankApplyStage(q){

  const add=o=>{if(o&&world.solids.indexOf(o)<0)world.solids.push(o)},rem=o=>{const i=world.solids.indexOf(o);if(i>=0)world.solids.splice(i,1)};
  F.stage=q;F.onGiant=q>=1;G.fair=q===2;world.planet=q===3;
  if(q===2)rem(fl);else add(fl);

  else{F.x=A.x+A.w-80;F.y=A.roof-34}

function frankStageStep(dt){
  const F=boss,A=world.arena;

  if(F.tr){
    const tr=F.tr;tr.t+=dt;P.inv=Math.max(P.inv,.3);
    if(tr.k===1){
      /* Frank hops and jumps down through the floor, then rises riding the giant FRANKBLASTER */
      if(tr.t<.35)F.y=tr.y0-Math.sin(tr.t/.35*Math.PI/2)*40;
      else if(tr.t<1)F.y+=(tr.t-.35)*900*dt;
      if(tr.t>=1){F.onGiant=true;F.x=A.x-600;F.gx=A.x+A.w/2;F.gy=A.roof-112;F.gRise=Math.min(1,(tr.t-1)/1.3)}

    }else if(tr.k===2){
      /* the screen tilts and VERDE-7 falls off the floor */
      if(tr.t>=.5&&F.stage!==2){frankApplyStage(2);setCanvasFX('tilt');G.flash=.4}
      if(tr.t>=1.4){setCanvasFX(null);F.tr=null}

}

function nearNpc(){
  if(!P||P.dead||G.mg||!world.npcs)return null;
  for(const n of world.npcs)if(Math.abs(P.x+5-n.x)<24&&Math.abs(P.y+P.h-n.y)<20)return n;
  return null;
}
function npcLines(n){
  if(n.mg){const won=collected.has('mgwin'+world.theme);return [won?'mg.again':'mg.intro']}
  return ['npc.'+n.k+'.1','npc.'+n.k+'.2','npc.'+n.k+'.3'];
}
function startTalk(n,keys,after){
  G.talk={n:n,keys:keys||npcLines(n),i:0,t:0,after:after||null};
  In.left=In.right=In.jump=In.shoot=In.dash=0;In.jumpHit=In.shootHit=In.dashHit=false;P.vx=0;
  sfx(660,.08,'square',.03,120);
}
function talkText(){const T0=G.talk;return t(T0.keys[T0.i],t('mg.'+world.theme+'.tg'))}
function talkAdvance(){
  const T0=G.talk;if(!T0)return;
  const full=talkText();
  if(T0.t*40<full.length){T0.t=full.length/40+.01;return}
  T0.i++;T0.t=0;sfx(520,.05,'square',.02,60);
  if(T0.i>=T0.keys.length){
    G.talk=null;In.jump=0;In.jumpHit=false;In.shoot=0;In.shootHit=false;
    const n=T0.n;
    if(T0.after)T0.after();
    else if(n&&n.mg)startMg(n);
    else if(n&&NPCS[n.k]&&NPCS[n.k].coin&&!collected.has(n.id)){collected.add(n.id);Inv.coins++;toast(t('t.npcCoin'),2);sfx(880,.2,'square',.05,400)}
    else if(n)collected.add(n.id);
  }
}
function talkStep(dt){
  const T0=G.talk;T0.t+=dt;
  if(In.jumpHit||In.shootHit){In.jumpHit=false;In.shootHit=false;talkAdvance()}
}
function drawTalk(){
  const T0=G.talk;if(!T0)return;
  const d=NPCS[T0.n?T0.n.k:'']||{name:'?',col:'#ffd23f'},full=talkText();
  drawSay(d.name,d.col,full.slice(0,Math.floor(T0.t*40)));
  if(T0.t*40>=full.length&&Math.floor(NOW*3)%2)txt('▼',W-24,48+14+wrapTxt(full,40).length*11-10,d.col);
}

/* ---------- shooting-gallery minigame ---------- */
function startMg(n){
  G.mg={n:n,b:n.b,t:20,hits:0,need:10,list:[],spawn:.4,end:0};
  toast(t('mg.go'),1.4);sfx(700,.3,'square',.05,300);
}
function mgStep(dt){
  const M=G.mg;
  if(M.end){M.end-=dt;if(M.end<=0)mgFinish();return}
  M.t-=dt;M.spawn-=dt;
  if(M.spawn<=0&&M.list.length<3){
    M.spawn=.55+Math.random()*.35;
    const b=M.b,lane=[8,30,52][Math.floor(Math.random()*3)];
    let px=b.x+2*T+Math.random()*(b.w-4*T);
    if(Math.abs(px-(P.x+5))<26)px+=px<P.x?-40:40;
    px=clamp(px,b.x+T,b.x+b.w-T);
    M.list.push({x:px,y:b.y-lane,life:2.2,ph:Math.random()*6});
  }
  for(let i=M.list.length-1;i>=0;i--){
    const q=M.list[i];q.life-=dt;
    const box={x:q.x-6,y:q.y-6+Math.sin(NOW*4+q.ph)*2,w:12,h:12};
    let hit=false;
    for(let j=bullets.length-1;j>=0;j--)if(overlapR(bullets[j],box)){bullets.splice(j,1);hit=true;break}
    if(hit){M.hits++;M.list.splice(i,1);burst(q.x,q.y,12,mgCol(),90,.4);sfx(500+M.hits*60,.08,'square',.04,300);continue}
    if(q.life<=0)M.list.splice(i,1);
  }
  if(M.hits>=M.need||M.t<=0){M.end=.6;M.list.length=0}
}
function mgFinish(){
  const M=G.mg;G.mg=null;
  const win=M.hits>=M.need,first=win&&!collected.has('mgwin'+world.theme);
  if(first){collected.add('mgwin'+world.theme);Inv.coins+=2;sfx(880,.4,'square',.06,600)}
  startTalk(M.n,[win?(first?'mg.win':'mg.win2'):'mg.lose'],()=>{});
}
function mgCol(){return world.theme===2?'#9be36b':world.theme===3?'#7fe8ff':'#ff7ac8'}
function drawMg(cx,cy){
  const M=G.mg;if(!M)return;
  for(const q of M.list){
    const x=Math.round(q.x-cx),y=Math.round(q.y-cy+Math.sin(NOW*4+q.ph)*2),bl=q.life<.6&&Math.floor(NOW*12)%2;

/* ---------- sequence puzzles ---------- */
const PZ_COL=['#ff4fd8','#35e8ff','#ffd23f','#7dff7a'];
function pzReset(){
  for(const z of world.pz||[]){
    const solved=killed.has(z.id),i=world.solids.indexOf(z.gate);
    z.gate.closed=!solved;
    if(solved&&i>=0)world.solids.splice(i,1);
    if(!solved&&i<0)world.solids.push(z.gate);
    z.state=solved?'done':'idle';z.t=0;z.k=0;z.i=0;for(const o of z.orbs){o.lit=0;o.ok=0;o.bad=0}
  }
}
function pzStep(dt){
  for(const z of world.pz||[]){
    for(const o of z.orbs){o.lit=Math.max(0,o.lit-dt);o.ok=Math.max(0,o.ok-dt);o.bad=Math.max(0,o.bad-dt)}
    if(z.state==='done')continue;
    const on=P&&!P.dead&&P.x>z.b.x-T&&P.x<z.gate.x&&Math.abs(P.y+P.h-z.b.y)<90;
    z.t+=dt;
    if(z.state==='idle'){
      if(on){z.state='show';z.t=-.4;z.k=0;z.seq=[];let last=-1;for(let k=0;k<z.len;k++){let v;do v=Math.floor(Math.random()*z.orbs.length);while(v===last);z.seq.push(v);last=v}
        if(!G.pzTip){G.pzTip=1;toast(t('pz.hint'),3)}}
      continue;
    }
    if(!on&&z.state!=='show'){z.state='idle';continue}
    if(z.state==='show'){
      const k=Math.floor(z.t/.7);
      if(z.t>=0&&k<z.seq.length&&k>=z.k){z.k=k+1;const o=z.orbs[z.seq[k]];o.lit=.5;sfx(330+z.seq[k]*110,.35,'square',.04,0)}
      if(z.t>=z.seq.length*.7){z.state='input';z.i=0}
      continue;
    }
    if(z.state==='wait'){if(z.t>1){z.state='show';z.t=-.3;z.k=0}continue}
    /* input: shoot the orbs in the order shown */
    for(let n=0;n<z.orbs.length;n++){
      const o=z.orbs[n],box={x:o.x-6,y:o.y-6,w:12,h:12};
      let hit=false;
      for(let j=bullets.length-1;j>=0;j--)if(overlapR(bullets[j],box)){bullets.splice(j,1);hit=true;break}
      if(!hit)continue;
      if(n===z.seq[z.i]){
        o.ok=.4;sfx(330+n*110,.2,'square',.05,0);z.i++;
        if(z.i>=z.seq.length){
          z.state='done';killed.add(z.id);if(snap&&snap.killed)snap.killed.add(z.id);z.gate.closed=false;
          const gi=world.solids.indexOf(z.gate);if(gi>=0)world.solids.splice(gi,1);
          burst(z.gate.x+8,z.b.y-30,30,'#ffd23f',150,.7);toast(t('pz.ok'),2.2);sfx(523,.5,'square',.06,523);G.shake=.2;
        }
      }else{
        for(const q of z.orbs)q.bad=.6;sfx(110,.4,'sawtooth',.06,-40);toast(t('pz.wrong'),1.4);z.state='wait';z.t=0;
      }
      break;
    }
  }
}
function drawPz(cx,cy,pal){
  for(const z of world.pz||[]){
    if(z.gate.x-cx<-60||z.gate.x-cx>W+260)continue;
    if(z.gate.closed)drawBarrier(z.gate,cx,cy,pal);
    for(let n=0;n<z.orbs.length;n++){
      const o=z.orbs[n],x=Math.round(o.x-cx),y=Math.round(o.y-cy),c=PZ_COL[n%4];
      ctx.fillStyle='#2a3258';ctx.fillRect(x-1,y+5,2,Math.round(z.b.y-o.y)-5);
      const on=z.state==='done'||o.lit>0||o.ok>0;
      if(on){ctx.globalAlpha=.3;ctx.fillStyle=c;ctx.fillRect(x-9,y-9,18,18);ctx.globalAlpha=1}
      ctx.fillStyle='#0d1126';ctx.fillRect(x-6,y-6,12,12);
      ctx.fillStyle=o.bad>0&&Math.floor(NOW*16)%2?'#ff3b30':on?c:mixc(c,'#14182e',.65);ctx.fillRect(x-5,y-5,10,10);
      ctx.fillStyle='#ffffff';ctx.globalAlpha=on?.9:.3;ctx.fillRect(x-3,y-3,3,2);ctx.globalAlpha=1;
    }
  }
}

E3.hopper=function(e,dt){

    if(!was){e.vx=0;burst(e.x+6,e.y+10,4,'#9be36b',40,.2)}
    e.t-=dt;
    const dx=(P.x+5)-(e.x+6),dy=(P.y+6)-(e.y+5);
    e.face=dx>=0?1:-1;
    if(e.t<=0&&Math.abs(dx)<150&&Math.abs(dy)<90){e.vx=e.face*Math.min(90,Math.abs(dx)*1.1+20);e.vy=-250;e.t=1.2+Math.random()*.5;sfx(260,.12,'triangle',.04,300)}
  }
  if((e.x<e.min&&e.vx<0)||(e.x+e.w>e.max&&e.vx>0))e.vx=0;
  if(e.y>WH+40){const i=enemies.indexOf(e);if(i>=0)enemies.splice(i,1);return}
  if(overlapR(e,P))hurtPlayer(25,e.x+6);
};

    R('#0d1126',-6,-18,12,13);R('#d9c27a',-5,-17,10,11);R('#07060f',-4,-14,3,3);R('#07060f',1,-14,3,3);R('#ff3b30',-4,-13,1,1);R('#ff3b30',1,-13,1,1);
    R('#8a2a2a',-7,-20,14,3);R('#8a2a2a',-4,-23,8,3);R('#ffd23f',-4,-9,8,1);

    R('#ffd23f',-14,-4,6,6);R('#fff2a0',-13,-3,2,2);

/* ---------- the book screen ---------- */
function jrCount(){return JR.filter(e=>(Jr[e.id]||0)>=e.need).length}
function showBook(back){
  jrPortraits();
  const acts={back:back},li=Math.max(0,LANGS.indexOf(Cfg.lang));
  const seen=JR.filter(e=>Jr[e.id]).length;
  let h='<h2>'+t('jr.title')+'</h2><p class="dim small">'+t('jr.prog',seen,JR.length,jrCount())+'</p><div class="menu">'+btn(t('menu.back'),'back','alt');
  let w=0;
  for(const e of JR){
    if(e.w!==w){w=e.w;h+='<p class="dim small">'+t('jr.w'+w)+'</p>'}
    const k=Jr[e.id]||0,done=k>=e.need;
    acts['j:'+e.id]=()=>showEntry(e,back);
    const img=k?'<img src="'+JRP[e.id]+'" width="40" height="40" style="image-rendering:pixelated;vertical-align:middle;margin-right:8px;float:left">':'<img src="'+JRP[e.id]+'" width="40" height="40" style="image-rendering:pixelated;vertical-align:middle;margin-right:8px;float:left;filter:brightness(0) opacity(.5)">';
    h+=btn(img+'<b>'+(done?'✦ ':'')+(k?jrName(e.id):'???')+'</b><br><span class="small">'+(k?t('jr.kills',k)+(done?'':' · '+t('jr.need',e.need-k)):t('jr.unknown'))+'</span>','j:'+e.id,'slot'+(done?' sel':''));
  }
  h+=btn(t('menu.back'),'back','alt')+'</div>';
  setMenu(h,acts,true,()=>showBook(back));
}
function showEntry(e,back){
  const k=Jr[e.id]||0,done=k>=e.need,acts={back:()=>showBook(back)};
  let h='<h2>'+(k?jrName(e.id):'???')+'</h2>';
  h+='<div style="text-align:center"><img src="'+JRP[e.id]+'" width="144" height="144" style="image-rendering:pixelated;'+(k?'':'filter:brightness(0) opacity(.5)')+'"></div>';
  h+='<p class="dim small">'+t('jr.kills',k)+(done?' · ✦ '+t('jr.complete'):' · '+t('jr.need',Math.max(0,e.need-k)))+'</p>';
  if(k)h+='<p>'+t('jr.'+e.id+'.d')+'</p>';else h+='<p class="dim">'+t('jr.unknownL')+'</p>';
  h+='<p class="small"><b>'+t('jr.notes')+'</b><br>'+(done?'<i>«'+t('jr.'+e.id+'.h')+'»</i>':'<span class="dim">'+t('jr.locked',e.need)+'</span>')+'</p>';
  h+='<div class="menu">'+btn(t('menu.back'),'back','alt')+'</div>';
  setMenu(h,acts,true,()=>showEntry(e,back));
}

  'jr.unknownL':['Le pagine sono vuote. Abbatti questa creatura per scoprirla.','The pages are blank. Defeat this creature to discover it.','Las páginas están en blanco. Derrota a esta criatura para descubrirla.','Les pages sont vides. Vaincs cette créature pour la découvrir.'],
  'jr.notes':['NOTE DEL CACCIATORE','HUNTER’S NOTES','NOTAS DEL CAZADOR','NOTES DU CHASSEUR'],
  'jr.locked':['Abbattine {0} per leggere le note.','Defeat {0} to read the notes.','Derrota {0} para leer las notas.','Vaincs-en {0} pour lire les notes.'],
  'jr.w1':['TETTI DI NEO-VERDANA','ROOFTOPS OF NEO-VERDANA','AZOTEAS DE NEO-VERDANA','TOITS DE NEO-VERDANA'],
  'jr.w2':['GIARDINI DI FLORA','GARDENS OF FLORA','JARDINES DE FLORA','JARDINS DE FLORA'],
  'jr.w3':['LE FONDAMENTA','THE FOUNDATIONS','LOS CIMIENTOS','LES FONDATIONS'],
  'jr.w4':['CASTELLO DI UNITY','UNITY CASTLE','CASTILLO DE UNITY','CHÂTEAU DE UNITY'],
  'jr.w5':['OLTRE','BEYOND','MÁS ALLÁ','AU-DELÀ'],
  'npc.hunter.1':['...TU. SÌ, PROPRIO TU. HAI ABBATTUTO GLI DÈI DI QUESTA CITTÀ, UNO DOPO L’ALTRO.','...YOU. YES, YOU. YOU HAVE STRUCK DOWN THE GODS OF THIS CITY, ONE AFTER ANOTHER.','...TÚ. SÍ, TÚ. HAS DERRIBADO A LOS DIOSES DE ESTA CIUDAD, UNO TRAS OTRO.','...TOI. OUI, TOI. TU AS ABATTU LES DIEUX DE CETTE VILLE, L’UN APRÈS L’AUTRE.'],
  'npc.hunter.2':['IO LI HO CACCIATI PRIMA DI TE. LI HO STUDIATI, DISEGNATI, CONTATI.','I HUNTED THEM BEFORE YOU. I STUDIED THEM, DREW THEM, COUNTED THEM.','YO LOS CACÉ ANTES QUE TÚ. LOS ESTUDIÉ, LOS DIBUJÉ, LOS CONTÉ.','JE LES AI CHASSÉS AVANT TOI. JE LES AI ÉTUDIÉS, DESSINÉS, COMPTÉS.'],
  'npc.hunter.3':['MA IL MIO CODICE SI STA ROMPENDO. NON DOVREI NEMMENO ESSERE QUI.','BUT MY CODE IS BREAKING APART. I SHOULD NOT EVEN BE HERE.','PERO MI CÓDIGO SE ESTÁ ROMPIENDO. NI SIQUIERA DEBERÍA ESTAR AQUÍ.','MAIS MON CODE SE BRISE. JE NE DEVRAIS MÊME PAS ÊTRE ICI.'],
  'npc.hunter.4':['PRENDI IL MIO LIBRO. OGNI CREATURA CHE ABBATTI VERRÀ SCRITTA DA SOLA SULLE SUE PAGINE.','TAKE MY BOOK. EVERY CREATURE YOU DEFEAT WILL WRITE ITSELF INTO ITS PAGES.','TOMA MI LIBRO. CADA CRIATURA QUE DERROTES SE ESCRIBIRÁ SOLA EN SUS PÁGINAS.','PRENDS MON LIVRE. CHAQUE CRÉATURE QUE TU VAINCS S’ÉCRIRA D’ELLE-MÊME DANS SES PAGES.'],
  'npc.hunter.5':['RIEMPILO, CACCIATORE... E FORSE QUALCUNO SI RICORDERÀ DI M-M-ME...','FILL IT, HUNTER... AND MAYBE SOMEONE WILL REMEMBER M-M-ME...','LLÉNALO, CAZADOR... Y QUIZÁ ALGUIEN SE ACUERDE DE M-M-MÍ...','REMPLIS-LE, CHASSEUR... ET PEUT-ÊTRE QUE QUELQU’UN SE SOUVIENDRA DE M-M-MOI...']};
  /* bestiary: name, description, hunter's note */
  const E={
  scrap:[['ROTTAME','SCRAPPER','CHATARRERO','FERRAILLEUR'],['Robot di scarto rimesso in piedi dai cavi di Unity. Pattuglia i tetti e carica chi si avvicina.','A junk robot set back on its feet by Unity’s cables. It patrols the roofs and charges anyone nearby.','Un robot de desecho puesto en pie por los cables de Unity. Patrulla las azoteas y embiste a quien se acerque.','Un robot de rebut remis debout par les câbles de Unity. Il patrouille les toits et charge quiconque approche.'],['Stupidi, ma tanti. Ne ho contati più di quanti ne potessi rompere.','Stupid, but many. I counted more of them than I could ever break.','Tontos, pero muchos. Conté más de los que podía romper.','Stupides, mais nombreux. J’en ai compté plus que je ne pouvais en briser.']],
  drone:[['DRONE SENTINELLA','SENTRY DRONE','DRON CENTINELA','DRONE SENTINELLE'],['Occhio volante della città. Prende la mira a lungo, poi spara un raggio sottile.','The city’s flying eye. It aims for a long time, then fires a thin beam.','El ojo volador de la ciudad. Apunta largo rato y luego dispara un rayo fino.','L’œil volant de la ville. Il vise longtemps, puis tire un mince rayon.'],['Quando la sua lente diventa rossa, non stare fermo. Mai.','When its lens turns red, do not stand still. Ever.','Cuando su lente se vuelve roja, no te quedes quieto. Nunca.','Quand sa lentille devient rouge, ne reste pas immobile. Jamais.']],
  mini1:[['ROTTAME TITANO','SCRAP TITAN','TITÁN CHATARRA','TITAN DE FERRAILLE'],['Mille rottami fusi in un solo corpo. Guardiano del Ponte dei Cavi.','A thousand scrappers fused into one body. Guardian of the Cable Bridge.','Mil chatarreros fundidos en un solo cuerpo. Guardián del Puente de Cables.','Mille ferrailleurs fondus en un seul corps. Gardien du Pont des Câbles.'],['Pesante. Lento a girarsi. Stagli alle spalle e colpisci.','Heavy. Slow to turn. Stay behind it and strike.','Pesado. Lento al girar. Ponte a su espalda y golpea.','Lourd. Lent à se retourner. Reste dans son dos et frappe.']],
  colossus:[['COLOSSO CORAZZATO','ARMORED COLOSSUS','COLOSO BLINDADO','COLOSSE BLINDÉ'],['La prima grande macchina di Unity. Regnava sui tetti con pugni e missili.','Unity’s first great machine. It ruled the rooftops with fists and missiles.','La primera gran máquina de Unity. Reinaba en las azoteas con puños y misiles.','La première grande machine de Unity. Elle régnait sur les toits avec poings et missiles.'],['Un dio di latta. Il primo che ho visto cadere. Non l’ultimo.','A tin god. The first I saw fall. Not the last.','Un dios de hojalata. El primero que vi caer. No el último.','Un dieu de fer-blanc. Le premier que j’ai vu tomber. Pas le dernier.']],
  plant:[['FIORE MORDACE','BITING BLOOM','FLOR MORDAZ','FLEUR MORDANTE'],['Un fiore di Flora con troppi denti. Resta immobile e azzanna chi passa.','One of Flora’s flowers with too many teeth. It stays still and bites anyone passing.','Una flor de Flora con demasiados dientes. Se queda quieta y muerde a quien pasa.','Une fleur de Flora avec trop de dents. Elle reste immobile et mord quiconque passe.'],['Non annusarlo. Fidati.','Do not smell it. Trust me.','No la huelas. Confía en mí.','Ne la sens pas. Crois-moi.']],
  spitter:[['SPUTASEMI','SEED SPITTER','ESCUPESEMILLAS','CRACHE-GRAINES'],['Piccolo baccello volante che sputa semi velenosi dall’alto.','A small flying pod that spits poisoned seeds from above.','Una pequeña vaina voladora que escupe semillas venenosas desde arriba.','Une petite cosse volante qui crache des graines empoisonnées d’en haut.'],['Prende le distanze apposta. Codardo, ma preciso.','It keeps its distance on purpose. Cowardly, but precise.','Mantiene la distancia a propósito. Cobarde, pero preciso.','Il garde ses distances exprès. Lâche, mais précis.']],
  shield:[['SCUDO DI CORTECCIA','BARK SHIELD','ESCUDO DE CORTEZA','BOUCLIER D’ÉCORCE'],['Guerriero del bosco dietro uno scudo di corteccia. Davanti è impenetrabile.','A forest warrior behind a bark shield. From the front it is impenetrable.','Un guerrero del bosque tras un escudo de corteza. De frente es impenetrable.','Un guerrier des bois derrière un bouclier d’écorce. De face, il est impénétrable.'],['Si gira piano. Più piano di quanto creda.','It turns slowly. Slower than it thinks.','Se gira despacio. Más despacio de lo que cree.','Il se retourne lentement. Plus lentement qu’il ne le croit.']],
  bird:[['PASSERO D’ARGENTO','SILVER SPARROW','GORRIÓN DE PLATA','MOINEAU D’ARGENT'],['Uccellino che aspetta immobile e poi si lancia in picchiata.','A little bird that waits motionless, then dives at you.','Un pajarito que espera inmóvil y luego se lanza en picado.','Un petit oiseau qui attend immobile, puis plonge sur toi.'],['Un colpo solo e cade. Ma ne arrivano sempre altri.','One hit and it falls. But more always come.','Un golpe y cae. Pero siempre llegan más.','Un coup et il tombe. Mais il en arrive toujours d’autres.']],
  hopper:[['RANA SPINOSA','SPINY FROG','RANA ESPINOSA','GRENOUILLE ÉPINEUSE'],['Rana coperta di spine che salta addosso a chi si avvicina.','A frog covered in spines that leaps at anyone nearby.','Una rana cubierta de espinas que salta sobre quien se acerca.','Une grenouille couverte d’épines qui bondit sur quiconque approche.'],['Colpiscila quando atterra: in aria è tutta spine.','Hit it when it lands: in the air it is all spines.','Golpéala cuando aterrice: en el aire es todo espinas.','Frappe-la quand elle atterrit : en l’air, elle n’est qu’épines.']],
  mini2:[['GRAN MANGIATORE','GREAT DEVOURER','GRAN DEVORADOR','GRAND DÉVOREUR'],['Il più vecchio fiore del giardino. Ha mangiato tutto ciò che cresceva intorno a sé.','The oldest flower in the garden. It ate everything that grew around it.','La flor más vieja del jardín. Se comió todo lo que crecía a su alrededor.','La plus vieille fleur du jardin. Elle a mangé tout ce qui poussait autour d’elle.'],['Ha fame anche adesso. Soprattutto adesso.','It is hungry even now. Especially now.','Tiene hambre incluso ahora. Sobre todo ahora.','Il a faim même maintenant. Surtout maintenant.']],
  flora:[['MADRE FLORA','MOTHER FLORA','MADRE FLORA','MÈRE FLORA'],['Regina dei giardini sospesi. Un tempo gentile, ora piegata dalla voce di Unity.','Queen of the hanging gardens. Once kind, now bent by Unity’s voice.','Reina de los jardines colgantes. Antes amable, ahora doblegada por la voz de Unity.','Reine des jardins suspendus. Autrefois douce, aujourd’hui pliée par la voix de Unity.'],['Il suo cuore batteva ancora quando è caduta. Ho sentito il polline piangere.','Her heart was still beating when she fell. I heard the pollen weep.','Su corazón aún latía cuando cayó. Oí llorar al polen.','Son cœur battait encore quand elle est tombée. J’ai entendu le pollen pleurer.']],
  horror:[['ORRORE','HORROR','HORROR','HORREUR'],['Ammasso di carne e ossa nato nel buio delle fondamenta.','A mass of flesh and bone born in the dark of the foundations.','Una masa de carne y hueso nacida en la oscuridad de los cimientos.','Un amas de chair et d’os né dans le noir des fondations.'],['Non chiedermi cosa fosse prima. Non lo voglio sapere.','Do not ask me what it was before. I do not want to know.','No me preguntes qué era antes. No quiero saberlo.','Ne me demande pas ce que c’était avant. Je ne veux pas le savoir.']],
  machine:[['OPERAIO MECCANICO','WORKER MACHINE','OBRERO MECÁNICO','OUVRIER MÉCANIQUE'],['Robot da cantiere ancora fedele agli ordini di scavo di OBLIVION.','A construction robot still loyal to OBLIVION’s digging orders.','Un robot de obra aún fiel a las órdenes de excavación de OBLIVION.','Un robot de chantier encore fidèle aux ordres de forage d’OBLIVION.'],['Lavora anche mentre lo colpisci. Ammirevole, quasi.','It keeps working while you hit it. Almost admirable.','Sigue trabajando mientras lo golpeas. Casi admirable.','Il continue de travailler pendant que tu le frappes. Presque admirable.']],
  mosq:[['ZANZARA DELLE FOGNE','SEWER MOSQUITO','MOSQUITO DE LAS CLOACAS','MOUSTIQUE DES ÉGOUTS'],['Insetto enorme e ronzante che vive nell’umido delle fondamenta.','A huge buzzing insect living in the damp of the foundations.','Un insecto enorme y zumbador que vive en la humedad de los cimientos.','Un énorme insecte bourdonnant qui vit dans l’humidité des fondations.'],['Il ronzio arriva sempre un attimo prima della puntura.','The buzz always comes a moment before the sting.','El zumbido siempre llega un instante antes de la picadura.','Le bourdonnement arrive toujours un instant avant la piqûre.']],
  tent:[['TENTACOLO','TENTACLE','TENTÁCULO','TENTACULE'],['Un tentacolo nero che spunta dal pavimento. Nessuno sa a cosa sia attaccato.','A black tentacle rising from the floor. Nobody knows what it is attached to.','Un tentáculo negro que sale del suelo. Nadie sabe a qué está unido.','Un tentacule noir qui surgit du sol. Personne ne sait à quoi il est rattaché.'],['Ho scavato per scoprirlo. Ho smesso di scavare.','I dug to find out. I stopped digging.','Excavé para averiguarlo. Dejé de excavar.','J’ai creusé pour le découvrir. J’ai arrêté de creuser.']],
  worm:[['VERME DELLE FONDAMENTA','FOUNDATION WORM','GUSANO DE LOS CIMIENTOS','VER DES FONDATIONS'],['Verme gigante che nuota nel cemento e spunta sotto i piedi di chi cammina.','A giant worm that swims through concrete and bursts out under walkers’ feet.','Un gusano gigante que nada en el cemento y sale bajo los pies de quien camina.','Un ver géant qui nage dans le béton et surgit sous les pieds des marcheurs.'],['Sotto terra è intoccabile. Fuori, è solo un verme.','Underground it is untouchable. Outside, it is just a worm.','Bajo tierra es intocable. Fuera, solo es un gusano.','Sous terre, il est intouchable. Dehors, ce n’est qu’un ver.']],
  mini3:[['ORRORE MAGGIORE','GREATER HORROR','HORROR MAYOR','HORREUR MAJEURE'],['Il più grande degli orrori. Custodisce il pozzo verticale.','The largest of the horrors. It guards the vertical shaft.','El mayor de los horrores. Custodia el pozo vertical.','La plus grande des horreurs. Elle garde le puits vertical.'],['Più grande non vuol dire più forte. Vuol dire più lento.','Bigger does not mean stronger. It means slower.','Más grande no significa más fuerte. Significa más lento.','Plus grand ne veut pas dire plus fort. Ça veut dire plus lent.']],
  centaur:[['OBLIVION','OBLIVION','OBLIVION','OBLIVION'],['Macchina scavatrice dalle mille braccia. Voleva far crollare Neo-Verdana dalle radici.','A digging machine with a thousand arms. It wanted to bring Neo-Verdana down from its roots.','Una máquina excavadora de mil brazos. Quería derrumbar Neo-Verdana desde sus raíces.','Une foreuse aux mille bras. Elle voulait abattre Neo-Verdana par ses racines.'],['Il suo nome significa dimenticanza. Io non l’ho dimenticato.','Its name means forgetting. I have not forgotten it.','Su nombre significa olvido. Yo no lo he olvidado.','Son nom signifie oubli. Moi, je ne l’ai pas oublié.']],
  bonez:[['BONEZ, IL MECCANICO REALE','BONEZ, THE ROYAL MECHANIC','BONEZ, EL MECÁNICO REAL','BONEZ, LE MÉCANICIEN ROYAL'],['Scheletro esile che ripara il mondo con gli attrezzi di un re. Appare solo a chi raccoglie ogni ingranaggio.','A slender skeleton who fixes the world with a king’s tools. He shows himself only to those who gather every gear.','Un esqueleto esbelto que repara el mundo con herramientas de rey. Solo aparece a quien reúne cada engranaje.','Un squelette élancé qui répare le monde avec les outils d’un roi. Il n’apparaît qu’à qui rassemble chaque engrenage.'],['Mi ha fatto una domanda, tanto tempo fa. Non ho ancora una risposta.','He asked me a question, long ago. I still have no answer.','Me hizo una pregunta hace mucho. Todavía no tengo respuesta.','Il m’a posé une question, il y a longtemps. Je n’ai toujours pas de réponse.']],
  alch:[['ALCHIMISTA','ALCHEMIST','ALQUIMISTA','ALCHIMISTE'],['Servo del castello che lancia ampolle di veleno ribollente.','A castle servant who hurls flasks of bubbling poison.','Un sirviente del castillo que lanza frascos de veneno burbujeante.','Un serviteur du château qui lance des fioles de poison bouillonnant.'],['Le sue pozzanghere restano a terra. Guarda dove metti i piedi.','Its puddles stay on the ground. Watch your step.','Sus charcos se quedan en el suelo. Mira dónde pisas.','Ses flaques restent au sol. Regarde où tu mets les pieds.']],
  guard:[['GUARDIA REALE','ROYAL GUARD','GUARDIA REAL','GARDE ROYAL'],['Soldato corazzato del castello di Unity, armato di lancia.','An armored soldier of Unity Castle, armed with a spear.','Un soldado acorazado del castillo de Unity, armado con lanza.','Un soldat en armure du château de Unity, armé d’une lance.'],['Obbedisce a un re che non lo ha mai guardato in faccia.','It obeys a king who never once looked at its face.','Obedece a un rey que nunca lo miró a la cara.','Il obéit à un roi qui ne l’a jamais regardé en face.']],
  turret:[['CANNONE REALE','ROYAL CANNON','CAÑÓN REAL','CANON ROYAL'],['Cannone dei bastioni che spara palle infuocate ad arco.','A rampart cannon that lobs fiery balls in an arc.','Un cañón de las murallas que dispara bolas ardientes en parábola.','Un canon des remparts qui tire des boulets enflammés en cloche.'],['Non mira dove sei. Mira dove sarai. Sorprendilo.','It does not aim where you are. It aims where you will be. Surprise it.','No apunta a donde estás. Apunta a donde estarás. Sorpréndelo.','Il ne vise pas là où tu es. Il vise là où tu seras. Surprends-le.']],
  mini4:[['CAPITANO DELLA GUARDIA','CAPTAIN OF THE GUARD','CAPITÁN DE LA GUARDIA','CAPITAINE DE LA GARDE'],['Il più fedele dei soldati di Unity. Comanda le mura del castello.','The most loyal of Unity’s soldiers. He commands the castle walls.','El más fiel de los soldados de Unity. Manda en las murallas del castillo.','Le plus fidèle des soldats de Unity. Il commande les murs du château.'],['La fedeltà è un’armatura pesante.','Loyalty is heavy armor.','La lealtad es una armadura pesada.','La loyauté est une lourde armure.']],
  unity:[['UNITY','UNITY','UNITY','UNITY'],['Essere d’ombra che ha unito la città sotto un solo pensiero: il suo.','A being of shadow that united the city under a single thought: its own.','Un ser de sombra que unió la ciudad bajo un solo pensamiento: el suyo.','Un être d’ombre qui a uni la ville sous une seule pensée : la sienne.'],['Il suo occhio vede tutto. Tranne chi gli sta davanti.','Its eye sees everything. Except whoever stands before it.','Su ojo lo ve todo. Excepto a quien tiene delante.','Son œil voit tout. Sauf celui qui se tient devant lui.']],
