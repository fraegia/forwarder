<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rooftop Protocol</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600&display=swap">
<style>
/* Layout: one centered 16:9 pixel screen with overlay menus; touch pad appears below on phones. Single dark look by choice. */
:root{
  --bg:#07060f; --panel:#110e22; --ink:#e8f7ee; --dim:#8c94b8; --line:#2b2752;
  --green:#3ddc84; --cyan:#35e8ff; --amber:#ffb020; --pink:#ff2bd6;
  --px:'Press Start 2P', ui-monospace, 'Courier New', monospace;
  --ui:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html,body{background:var(--bg)}
body{
  margin:0; color:var(--ink); font-family:var(--ui); font-size:14px;
  padding-block:12px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
h1{margin:0;font-family:var(--px);font-size:clamp(11px,2.4vw,16px);color:var(--green);letter-spacing:.04em;font-weight:400}
.tag{font-size:12px;color:var(--dim)}
.screen{position:relative;width:100%;aspect-ratio:16/9;background:#000;border:2px solid var(--line);overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,4,14,.88);padding:12px;overflow:auto}
.overlay[hidden]{display:none!important}
.card{max-width:560px;width:100%;text-align:left;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{margin:0;font-family:var(--px);font-weight:400;font-size:clamp(12px,3vw,22px);line-height:1.4;color:var(--green);text-wrap:balance}
.card p{margin:0;line-height:1.5;color:var(--ink);font-size:clamp(11px,1.7vw,14px)}
.card .dim{color:var(--dim)}
.card ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 14px;font-size:clamp(10px,1.5vw,12px);color:var(--dim)}
.card kbd{font-family:var(--px);font-size:.8em;color:var(--cyan)}
button.go{align-self:flex-start;font-family:var(--px);font-size:12px;padding:12px 16px;background:var(--green);color:#04130b;border:0;cursor:pointer;box-shadow:0 4px 0 #1d8f57}
button.go:hover{background:#6dffaa}
button.go:active{transform:translateY(3px);box-shadow:0 1px 0 #1d8f57}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.pad{display:none;justify-content:space-between;gap:12px;user-select:none;-webkit-user-select:none}
@media (pointer:coarse){.pad{display:flex}}
.pad .grp{display:flex;gap:10px;flex-wrap:wrap}
.pad button{font-family:var(--px);font-size:12px;min-width:56px;height:56px;background:var(--panel);color:var(--ink);border:2px solid var(--line);touch-action:none}
.pad button.on{background:#1c3a2c;border-color:var(--green)}
.keys{margin:0;font-size:12px;color:var(--dim);line-height:1.6}
.keys b{color:var(--ink);font-weight:600}

.screen:fullscreen{max-width:none;width:100vw;height:100vh;aspect-ratio:auto;border:0}
.screen:focus{outline:none}
/* fullscreen: the whole page goes fullscreen and the game screen fills it (so focus, and with it keyboard and controller, stays on the game) */
body.fs{overflow:hidden}
body.fs .screen{position:fixed;inset:0;width:100vw;height:100vh;aspect-ratio:auto;border:0;z-index:10;background:#000}
.overlay.lite{background:rgba(5,4,14,.62)}
.menu{display:flex;flex-direction:column;gap:8px;max-width:420px}
button.go.alt{background:var(--panel);color:var(--ink);box-shadow:0 4px 0 var(--line);border:1px solid var(--line)}
button.go.alt:hover{background:#1b1738}
button.go.slot{width:100%;text-align:left;font-family:var(--ui);font-size:14px;line-height:1.4;padding:10px 14px;background:var(--panel);color:var(--ink);box-shadow:0 3px 0 var(--line);border:1px solid var(--line)}
button.go.slot.sel{border-color:var(--green)}
button.go.slot:hover:not([disabled]){background:#1b1738}
button.go[disabled]{opacity:.4;cursor:not-allowed}
button.go .small,.small{font-size:12px;color:var(--dim);font-weight:400}
.langrow{display:flex;gap:6px;flex-wrap:wrap}
button.lang{font-family:var(--px);font-size:9px;padding:8px 10px;background:var(--panel);color:var(--ink);border:1px solid var(--line);cursor:pointer}
button.lang.sel{border-color:var(--green);color:var(--green)}
button.lang:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.fsb{font-family:var(--ui);font-size:12px;padding:6px 10px;background:var(--panel);color:var(--ink);border:1px solid var(--line);cursor:pointer}
.fsb:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.overlay>div{max-height:100%;overflow:auto}
/* in menus the selected item always shows the frame: browsers hide :focus-visible after a click (e.g. on the fullscreen button) even when navigating with stick or keyboard afterwards */
#ovc button:focus{outline:3px solid var(--cyan);outline-offset:2px}
.ver{position:absolute;right:8px;bottom:6px;z-index:2;font-family:var(--px);font-size:9px;color:var(--dim);pointer-events:none}
</style>

<div class="wrap">
  <header class="top"><h1>ROOFTOP PROTOCOL</h1><span class="tag" id="tagline"></span><button class="fsb" id="fsb" type="button"></button></header>
  <div class="screen" id="screen" tabindex="-1">
    <canvas id="c" aria-label="Schermo di gioco"></canvas>
    <div class="overlay" id="ov"><div class="card" id="ovc"></div></div>
    <span class="ver" id="ver"></span>
  </div>
  <div class="pad" id="pad">
    <div class="grp"><button data-k="left" aria-label="Sinistra">&#9664;</button><button data-k="right" aria-label="Destra">&#9654;</button></div>
    <div class="grp"><button data-k="dash">SCATTO</button><button data-k="shoot">SPARA</button><button data-k="jump">SALTA</button></div>
  </div>
  <p class="keys" id="keys"></p>
</div>

<script>
'use strict';
const W=384,H=216,T=16,ROWS=26,WH=ROWS*T;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');cv.width=W;cv.height=H;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash2(x,y){let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296}
function hexRgb(c){return[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
function mixc(a,b,t){const A=hexRgb(a),B=hexRgb(b);return'rgb('+Math.round(lerp(A[0],B[0],t))+','+Math.round(lerp(A[1],B[1],t))+','+Math.round(lerp(A[2],B[2],t))+')'}

/* ---------- sprites ---------- */
function fromRows(rows,pal){
  const h=rows.length,w=rows[0].length,c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');
  rows.forEach((r,y)=>{for(let x=0;x<w;x++){const ch=r[x];if(ch!=='.'&&pal[ch]){g.fillStyle=pal[ch];g.fillRect(x,y,1,1)}}});
  return c;
}
function flipC(c){const f=document.createElement('canvas');f.width=c.width;f.height=c.height;const g=f.getContext('2d');g.translate(c.width,0);g.scale(-1,1);g.drawImage(c,0,0);return f}
function whiteC(c){const f=document.createElement('canvas');f.width=c.width;f.height=c.height;const g=f.getContext('2d');g.drawImage(c,0,0);g.globalCompositeOperation='source-in';g.fillStyle='#fff';g.fillRect(0,0,f.width,f.height);return f}
function pack(c){const l=flipC(c);return{r:c,l:l,wr:whiteC(c),wl:whiteC(l),w:c.width,h:c.height}}

const PLP={k:'#07130e',g:'#3ddc84',G:'#1d8f57',h:'#c8ffe0',c:'#35e8ff',a:'#ffb020'};
const SP_PA=pack(fromRows([
"...kkkkkk...",
"..kggggggk..",
".kggccccggk.",
".kgGGGGGGgk.",
"..kkkkkkkk..",
".kgggggggGk.",
"kggghaahgGk.",
"kgggggggggGk",
".kGGGGGGGGk.",
"..kgg..ggk..",
"..kgg..ggk..",
"..kgg..ggk..",
".kggGk.kGggk",
".kkkkk.kkkkk"],PLP));
const SP_PB=pack(fromRows([
"...kkkkkk...",
"..kggggggk..",
".kggccccggk.",
".kgGGGGGGgk.",
"..kkkkkkkk..",
".kgggggggGk.",
"kggghaahgGk.",
"kgggggggggGk",
".kGGGGGGGGk.",
"...kggggk...",
"...kggggk...",
"...kgGGgk...",
"...kggggk...",
"...kkkkkk..."],PLP));
const SP_SCRAP=pack(fromRows([
".......y......",
".......k......",
"...kkkkkkkk...",
"..krrrrrrrrk..",
"..krrseeesrrk.",
"..krrseeesrrk.",
"..krrrsssrrrk.",
"..kRRRRRRRRk..",
".kkrrrrrrrrkk.",
".ksrryyyyrrsk.",
".kRrrrrrrrrRk.",
"..kkkkkkkkkk..",
".kssSSSSSSssk.",
".kkkkkkkkkkkk."],{k:'#1a0c06',r:'#c4561a',R:'#7a2e12',s:'#9aa0a6',S:'#5b6066',e:'#ff2d2d',y:'#ffd23f'}));
const SP_DRONE=pack(fromRows([
"lllll......lllll",
"....k......k....",
"....kkkkkkkk....",
"...kddddddddk...",
"..kddlddddlddk..",
"..kdDDeeeeDDdk..",
"..kdDDeeeeDDdk..",
"..kddDDDDDDddk..",
"...kdddddddk....",
"....kkkkkkkk....",
".....y....y.....",
"....kk....kk...."],{k:'#0b0f1c',d:'#6b7ca3',D:'#3a4668',e:'#ff2d2d',l:'#b9c8ee',y:'#ffd23f'}));
const SP_BOSS=(function(){
  const c=document.createElement('canvas');c.width=56;c.height=56;const g=c.getContext('2d');
  const R=(col,x,y,w,h)=>{g.fillStyle=col;g.fillRect(x,y,w,h)};
  const K='#0a0c14',D='#38425c',M='#56668c',L='#8da0cf',RD='#ff3b30',AM='#ffb020';
  R(K,12,40,14,16);R(D,13,41,12,13);R(M,13,41,12,3);R(K,10,52,18,4);R(L,11,53,16,1);
  R(K,30,40,14,16);R(D,31,41,12,13);R(M,31,41,12,3);R(K,28,52,18,4);R(L,29,53,16,1);
  R(K,8,14,40,28);R(D,9,15,38,26);R(M,9,15,38,4);R(M,9,15,4,26);R(K,9,36,38,2);
  R(K,22,22,12,12);R(AM,24,24,8,8);R('#fff2c0',26,26,4,4);
  R(K,0,10,14,18);R(M,1,11,12,6);R(D,1,17,12,9);R(L,2,12,10,1);
  R(K,42,10,14,18);R(M,43,11,12,6);R(D,43,17,12,9);R(L,44,12,10,1);
  R(K,20,2,16,14);R(D,21,3,14,12);R(M,21,3,14,2);R(RD,23,8,10,3);R('#ffd0cc',25,9,6,1);R(K,27,0,2,3);R(RD,27,0,2,1);
  R(K,48,28,8,14);R(D,49,29,6,12);R(RD,52,32,4,4);
  R(K,0,28,8,14);R(D,1,29,6,12);R(RD,0,32,4,4);
  return pack(c);
})();

/* ---------- audio ---------- */
let AC=null,muted=false;
function sfx(f,d,type,v,slide){
  if(muted)return;
  try{
    if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(v||.04,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}

/* ---------- level ---------- */
const ZONES=16;
const ZONE_NAMES=['Tetti Nuovi','Via dei Cavi','Giardini Pensili','Torri Radio','Cupole Solari','Mercato Alto','Fabbrica Verticale','Ponte dei Cavi','Distretto Neon','Rete Elettrica','Serre Alte','Depositi Rottami','Zona Rossa','Altoforno','Cresta Antenne','Torre del Colosso'];
const PALS=[
  {top:'#1b1046',bot:'#7a2f86',acc:'#ff4fd8',far:'#2b1a5e',mid:'#3a2275'},
  {top:'#04141f',bot:'#0d5666',acc:'#35e8ff',far:'#0a2c3c',mid:'#0f4254'},
  {top:'#0d0a2a',bot:'#4f1d6a',acc:'#b58cff',far:'#1e1450',mid:'#2d1c6e'},
  {top:'#220a14',bot:'#7a1c2c',acc:'#ff6a3d',far:'#3a1220',mid:'#541a2c'}
];
function palAt(x){
  const n=world.pals.length-1,p=clamp(x/world.bossX,0,1)*n,i=Math.min(n-1,Math.floor(p)),t=p-i;
  const A=world.pals[i],B=world.pals[i+1];
  return{top:mixc(A.top,B.top,t),bot:mixc(A.bot,B.bot,t),acc:t<.5?A.acc:B.acc,far:mixc(A.far,B.far,t),mid:mixc(A.mid,B.mid,t)};
}

const world={specials:[],vendors:[],mini:null,theme:0,nz:16,names:null,pals:null,solids:[],buildings:[],plats:[],defs:[],pickups:[],checks:[],zoneX:[],decor:[],arena:null,door:null,exitWall:null,beacon:null,bossX:1,endX:1,spawn:{x:48,y:200}};
let nextId=1;

/* World 1 (Rooftops of Neo-Verdana). The rooftop run is still generated from a seed, but every
   zone now gets hand-designed set pieces that use the city vertically: wind vents, elevators,
   cable cars, blinking neon signs, radio towers to climb, vent pillars in the gaps and optional
   elevated routes. SET1 maps "zone:building" to the set piece placed in the gap before that
   building ('sky' is an optional route on the building itself). */
const SET1={'0:5':'vent','0:8':'vent','1:4':'cable','1:8':'cable','2:5':'elev','2:8':'pillar',
  '3:6':'tower','3:9':'neon','4:5':'pillar','4:8':'neon','5:4':'cable','5:7':'sky','6:4':'elev','6:8':'elev',
  '7:5':'cable','7:8':'neon','8:2':'neon','8:5':'neon','8:8':'pillar','9:5':'elev','9:8':'neon',
  '10:5':'tower','10:7':'sky','11:5':'cable','11:8':'pillar','12:5':'neon','12:8':'elev',
  '13:4':'pillar','13:7':'pillar','14:5':'tower','14:8':'cable','15:5':'elev'};
function buildLevel(){
  nextId=1;
  const r=mulberry32(20261121);
  const S=world;S.theme=1;S.nz=ZONES;S.names=ZONE_NAMES;S.pals=PALS;initFeatures(S);S.sets=[];
  let x=4;
  const bld=(x0,w,rw,z)=>{
    const b={x:x0*T,y:rw*T,w:w*T,h:(ROWS-rw)*T,row:rw,zone:z,seed:Math.floor(r()*1e6)};
    S.buildings.push(b);S.solids.push(b);
    /* roof props */
    const n=Math.floor(w/4);
    for(let k=0;k<n;k++){
      const px=b.x+T*(1+Math.floor(r()*(w-2))),kind=Math.floor(r()*4);
      S.decor.push({x:px,y:b.y,kind:kind,seed:Math.floor(r()*1e5)});
    }
    return b;
  };
  /* start building */
  const first=bld(0,12,16,0);
  let prev=first,prevRow=16;
  S.spawn={x:3*T,y:16*T-14};
  S.checks.push({x:6*T,y:16*T-32,w:T,h:32,id:'c0',active:true,spawnX:6*T,spawnY:16*T-14,name:'cp.start'});S.vendors.push({x:9*T,y:16*T,id:'v0'});
  x=12;
  const skyB=[];
  for(let z=0;z<ZONES;z++){
    const d=z/(ZONES-1);
    S.zoneX.push(x*T);
    const nB=10+(z%2);
    if(z===MINI_Z[1]){const m=buildMini(S,x,1,bld,prevRow);x=m.x;prevRow=m.row;prev=S.buildings[S.buildings.length-1]}
    for(let i=0;i<nB;i++){
      const sp=SET1[z+':'+i];
      let gap=2+Math.floor(r()*(z<3?2:z<7?4:6));
      if(i===0)gap=2;
      let w=6+Math.floor(r()*8);if(colAt(S.theme,z,i)>=0)w=Math.max(w,12);
      const isCheck=(i===0&&z>0&&z%3===0);
      if(isCheck)w=11;
      /* height change */
      let dRow=Math.floor(r()*5)-2;
      const up=-dRow;
      if(gap>=5&&Math.abs(dRow)>1)dRow=dRow>0?1:-1;
      if(gap>=3&&z<3&&up>1)dRow=-1;
      if(gap<=4&&up>2)dRow=-2;
      let row2=clamp(prevRow+dRow,11,20);
      let piece=null;
      if(sp&&sp!=='sky'){
        const n0=S.specials.length,b0=S.buildings.length;
        const res=setPiece1(S,sp,z,x,prev,prevRow,r,bld);
        S.sets.push({kind:sp,z:z,A:prev,sp:S.specials.slice(n0),bl:S.buildings.slice(b0)});
        x=res.x;row2=res.row;gap=0;piece=sp;if(res.w)w=res.w;
      }else if(gap>=4&&r()<(z<7?.45:.3)){
        /* platform helping long gaps */
        const px=(x+Math.floor(gap/2)-1)*T;
        const py=Math.min(prevRow,row2)*T+(r()<.5?0:T);
        const p={x:px,y:py,w:3*T,h:T/2,plat:true};
        S.plats.push(p);S.solids.push(p);
      }
      x+=gap;
      const b=bld(x,w,row2,z);b.sp=piece;featureHook(S,b,z,i,nB,isCheck);
      if(piece)S.sets[S.sets.length-1].B=b;
      if(sp==='sky')skyB.push(b);
      /* checkpoint */
      if(isCheck){
        S.checks.push({x:b.x+5*T,y:b.y-32,w:T,h:32,id:'c'+z,active:false,spawnX:b.x+5*T,spawnY:b.y-14,name:'cp.sector',n:z+1});
      }
      /* pickups: abilities at end of zones 2 and 6 */
      if(i===nB-1&&z===2)S.pickups.push({id:'dj',kind:'dj',x:b.x+b.w/2-6,y:b.y-20,w:12,h:12});
      if(i===nB-1&&z===6)S.pickups.push({id:'dash',kind:'dash',x:b.x+b.w/2-6,y:b.y-20,w:12,h:12});
      /* health */
      if(i===4&&z>0&&z%2===1)S.pickups.push({id:'hp'+z,kind:'hp',x:b.x+b.w/2-5,y:b.y-14,w:10,h:10});
      /* enemies (landing roofs of vents, elevators and towers stay clear) */
      const safe=b.colk||isCheck||(z===0&&i<2)||(i===nB-1&&(z===2||z===6))||(piece&&piece!=='cable'&&piece!=='neon');
      if(!safe&&w>=7){
        if(r()<.38+.34*d){
          S.defs.push({id:nextId++,type:'scrap',x:b.x+T*(2+Math.floor(r()*(w-4))),y:b.y-13,min:b.x+T,max:b.x+b.w-T});
        }
        if(w>=11&&r()<.3+.3*d){
          S.defs.push({id:nextId++,type:'scrap',x:b.x+T*3,y:b.y-13,min:b.x+T,max:b.x+b.w-T});
        }
        if(z>=1&&row2>=10&&r()<.12+.34*d){
          S.defs.push({id:nextId++,type:'drone',x:b.x+b.w/2+(r()-.5)*T*4,y:b.y-60-Math.floor(r()*34)});
        }
      }
      prev=b;prevRow=row2;x+=w;
    }
  }
  for(const b of skyB)skyRoute1(S,b);
  /* approach to boss: safe long roof with pre-boss checkpoint */
  S.zoneX.push(x*T);
  x+=2;
  const ap=bld(x,16,16,ZONES-1);
  S.checks.push({x:ap.x+8*T,y:ap.y-32,w:T,h:32,id:'cb',active:false,spawnX:ap.x+8*T,spawnY:ap.y-14,name:'cp.boss1'});
  S.pickups.push({id:'hpb',kind:'hp',x:ap.x+11*T,y:ap.y-14,w:10,h:10});
  x+=16;
  /* arena + exit corridor on the same roof */
  const arenaW=26,corrW=16;
  const ar=bld(x,arenaW+corrW,16,ZONES-1);
  S.arena={x:ar.x,y:ar.y,w:arenaW*T,trigger:ar.x+3*T,roof:ar.y};
  S.bossX=ar.x;

  enemies=Hell.on?[]:world.defs.filter(d=>!killed.has(d.id)).map(makeEnemy);
  bullets=[];ebullets=[];bombs=[];drops=[];parts=[];puddles=[];seeds=[];thorns=[];waves=[];whips=[];bzg=[];
}
function setDoor(closed){
  const i=world.solids.indexOf(world.door);
  if(closed&&i<0)world.solids.push(world.door);
  if(!closed&&i>=0)world.solids.splice(i,1);
  world.door.closed=closed;
}
function setExit(closed){
  const i=world.solids.indexOf(world.exitWall);
  if(closed&&i<0)world.solids.push(world.exitWall);
  if(!closed&&i>=0)world.solids.splice(i,1);
}
function newGame(){
  if(world.theme!==1){resetWorld();buildLevel()}
  killed=new Set();collected=new Set();
  world.checks.forEach(c=>c.active=c.id==='c0');
  checkpoint=world.checks[0];
  P=makePlayer();
  snap={killed:new Set(),collected:new Set(),coins:Inv.coins};
  boss=makeBoss();setDoor(false);setExit(true);
  spawnAll();
  G.time=0;G.deaths=0;G.kills=0;G.zone=0;G.shake=0;G.state='play';
  cam.x=0;cam.y=clamp(P.y-H/2,0,WH-H);
  toast(t('t.sector',1,zname(0)),2.6);
}
function respawn(){
  G.secret=false;
  const abil=P.abil;
  P=makePlayer();P.abil=abil;
  P.x=checkpoint.spawnX;P.y=checkpoint.spawnY;P.safe={x:P.x,y:P.y};
  killed=new Set(snap.killed);collected=new Set(snap.collected);if(snap.coins!==undefined)Inv.coins=snap.coins;
  boss=makeBossFor();setDoor(false);setExit(true);restoreArena();
  spawnAll();
  Music.mode(worldMusic());
  if(Hell.on&&world.hellArena){setDoor(true);Hell.wait=3;Hell.lastS=0;if(Hell.i===4)duoReset()}
  if(world.frank){boss=makeFrank(G.frankCk||0);resetFrankFX();enemies=enemies.filter(e=>!e.minion);if(G.frankStarted){boss.active=true;boss.phase='fight';boss.seen=true;setDoor(true);Music.mode('frank');Music.start()}frankApplyStage(G.frankStarted?G.frankCk||0:0)}
  G.state='play';G.shake=0;
  cam.x=P.x-W/2;cam.y=clamp(P.y-H/2,0,WH-H);
  toast(t('t.reboot',cpName(checkpoint)),2);
}
function chipCount(){let n=0;collected.forEach(k=>{if(k.indexOf('chip')===0)n++});return n}

/* ---------- player ---------- */
function hurtPlayer(dmg,srcX,soft){
  if(P.inv>0||P.dead||P.dashT>0||G.state!=='play')return;
  if(testNoDmg())return;
  dmg=Math.max(1,Math.round(dmg*DIFFS[Cfg.diff].dmgIn*(hasAmu('a_shield')?.85:1)));
  P.hp=Math.max(0,P.hp-dmg);P.inv=soft?.3:1;
  if(!soft){P.kb=.14;P.vx=((P.x+5)<srcX?-1:1)*120;P.vy=-130}
  P.dashT=0;
  G.shake=Math.max(G.shake,.18);
  burst(P.x+5,P.y+6,8,'#3ddc84',90,.4);sfx(140,.18,'sawtooth',.06,-80);
  if(P.hp<=0){P.dead=true;G.state='dead';G.deadT=0;G.deaths++;burst(P.x+5,P.y+6,40,'#3ddc84',160,.9);burst(P.x+5,P.y+6,20,'#35e8ff',120,.9);sfx(90,.6,'sawtooth',.08,-60)}
}
function updatePlayer(dt){
  const p=P;
  p.inv=Math.max(0,p.inv-dt);p.kb=Math.max(0,p.kb-dt);p.dmgT=Math.max(0,p.dmgT-dt);p.shootCd-=dt;p.dashCd-=dt;p.buf-=dt;p.anim+=dt;
  if(In.jumpHit){p.buf=.12;In.jumpHit=false}
  const dir=(In.right?1:0)-(In.left?1:0);
  if(dir&&p.dashT<=0&&p.kb<=0)p.face=dir;
  if(In.dashHit){
    In.dashHit=false;
    if(p.abil.dash&&p.dashCd<=0&&p.dashT<=0){p.dashT=.18;p.dashCd=.65;p.inv=Math.max(p.inv,.22);sfx(300,.15,'sawtooth',.05,400);burst(p.x+5,p.y+7,8,'#35e8ff',60,.3)}
  }
  if(p.dashT>0){p.dashT-=dt;p.vx=p.face*250;p.vy=0}
  else{
    if(p.kb<=0)p.vx=approach(p.vx,dir*RUN,(p.ground?1600:1000)*dt);
    p.vy=Math.min(p.vy+GRAV*dt,MAXFALL);
  }
  if(p.ground){p.coy=.09;p.air=true}else p.coy-=dt;
  if(p.buf>0){
    if(p.coy>0){p.vy=JUMP;p.coy=0;p.buf=0;p.ground=null;sfx(420,.12,'square',.04,300)}
    else if(p.abil.dj&&p.air){p.vy=JUMP*.95;p.air=false;p.buf=0;burst(p.x+5,p.y+13,10,'#c8ffe0',70,.35);sfx(560,.12,'square',.04,380)}
  }
  if(!In.jump&&p.vy<-120&&p.dashT<=0)p.vy=-120;
  moveBody(p,dt);
  const g=p.ground;
  if(g&&!g.plat&&g.w>=3*T&&p.x>g.x+10&&p.x+p.w<g.x+g.w-10)p.safe={x:p.x,y:p.y};
  if(g&&p.vy===0&&p.wasAir){burst(p.x+5,p.y+13,5,'#8c94b8',40,.25)}
  p.wasAir=!g;
  if(p.y>WH+30){
    if(boss.dead&&world.theme===2&&!Hell.on){endWorld2();return}
    if(trySecret())return;
    p.x=p.safe.x;p.y=p.safe.y;p.vx=0;p.vy=0;p.inv=0;
    hurtPlayer(20,p.x+5);P.vy=0;P.vx=0;P.kb=0;
    toast(t('t.fall'),1.4);
  }
  if(In.shoot&&p.shootCd<=0&&bullets.length<5&&p.dashT<=0){
    p.shootCd=.2;
    bullets.push({x:p.x+5+p.face*9,y:p.y+5,w:7,h:3,vx:p.face*320,life:.65,dmg:p.dmgT>0?40:20});
    sfx(900,.07,'square',.03,-500);
  }
}

/* ---------- enemies ---------- */
function killEnemy(e){
  const i=enemies.indexOf(e);if(i>=0)enemies.splice(i,1);
  if(!e.minion)killed.add(e.id);
  G.kills++;
  burst(e.x+e.w/2,e.y+e.h/2,e.type==='drone'?18:14,e.type==='drone'?'#b9c8ee':'#ff9f1c',130,.7);
  burst(e.x+e.w/2,e.y+e.h/2,6,'#ffd23f',90,.5);
  sfx(200,.25,'sawtooth',.05,-120);
  if(e.type==='shield')drops.push({x:e.x+e.w/2-5,y:e.y+e.h-10,w:10,h:10,vy:-80,t:-30,kind:'pot'});
  else if(e.type!=='bird'&&Math.random()<.22*DIFFS[Cfg.diff].drop)drops.push({x:e.x+e.w/2-5,y:e.y+e.h-10,w:10,h:10,vy:-80,t:0,kind:'hp'});
  if(e.id>0)rollLoot(e);
  if(hasAmu('a_vamp')&&P&&!P.dead)P.hp=Math.min(maxHP(),P.hp+3);
}
function updateScrap(e,dt){
  if(e.spawnT>0){e.spawnT-=dt;return}
  e.flash=Math.max(0,e.flash-dt);e.anim+=dt;
  const dx=(P.x+5)-(e.x+6),dy=(P.y+6)-(e.y+6);
  if(!e.aggro&&Math.abs(dx)<110&&Math.abs(dy)<34)e.aggro=true;
  if(e.aggro&&!e.minion&&(Math.abs(dx)>200||Math.abs(dy)>60))e.aggro=false;
  const sp=e.aggro?50:28;
  if(e.aggro)e.dir=dx>=0?1:-1;
  else{if(e.x<=e.min)e.dir=1;else if(e.x+e.w>=e.max)e.dir=-1}
  e.vx=e.dir*sp;
  if(e.aggro&&!e.minion){
    if(e.x<=e.min&&e.dir<0)e.vx=0;
    if(e.x+e.w>=e.max&&e.dir>0)e.vx=0;
  }
  e.vy=Math.min(e.vy+GRAV*dt,MAXFALL);
  moveBody(e,dt);
  if(e.wall)e.dir=-e.dir;
  if(overlapR(e,P))hurtPlayer(20,e.x+6);
}
function updateDrone(e,dt){
  e.flash=Math.max(0,e.flash-dt);e.t+=dt;
  const dx=(P.x+5)-e.ox,pcx=P.x+5,pcy=P.y+6;
  if(Math.abs(dx)<300){
    if(Math.abs(dx)>130)e.ox+=Math.sign(dx)*24*dt;
    else if(Math.abs(dx)<70)e.ox-=Math.sign(dx)*24*dt;
    e.ox=clamp(e.ox,e.hx-170,e.hx+170);
  }
  e.x=e.ox-e.w/2;e.y=e.oy+Math.sin(e.t*2)*4;
  e.face=dx>=0?1:-1;
  const cx=e.x+e.w/2,cy=e.y+e.h/2;
  e.st-=dt;
  if(e.state==='idle'){
    if(e.st<=0&&Math.abs(pcx-cx)<250&&Math.abs(pcy-cy)<170){e.state='aim';e.st=.75;e.ang=Math.atan2(pcy-cy,pcx-cx);sfx(700,.3,'sine',.025,300)}
  }else if(e.state==='aim'){
    if(e.st>.4)e.ang=Math.atan2(pcy-cy,pcx-cx);
    if(e.st<=0){
      e.state='fire';e.st=.14;e.hit=false;
      let L=0;const ca=Math.cos(e.ang),sa=Math.sin(e.ang);
      while(L<260&&!pointSolid(cx+ca*L,cy+sa*L))L+=4;
      e.len=L;sfx(240,.14,'sawtooth',.05,-150);
    }
  }else if(e.state==='fire'){
    if(!e.hit){
      const ca=Math.cos(e.ang),sa=Math.sin(e.ang);
      for(let L=8;L<=e.len;L+=4){
        const bx=cx+ca*L,by=cy+sa*L;
        if(bx>P.x-2&&bx<P.x+P.w+2&&by>P.y-2&&by<P.y+P.h+2){e.hit=true;hurtPlayer(20,cx);break}
      }
    }
    if(e.st<=0){e.state='idle';e.st=2.2}
  }
  if(overlapR(e,P))hurtPlayer(20,cx);
}

/* ---------- boss ---------- */
function bossMinions(){let n=0;for(const e of enemies)if(e.minion)n++;return n}
function bossShoot(ang){
  const cx=boss.x+boss.w/2+boss.face*14,cy=boss.y+24;
  ebullets.push({x:cx,y:cy,vx:Math.cos(ang)*190,vy:Math.sin(ang)*190,r:3,dmg:30,life:2.4});
  sfx(260,.12,'sawtooth',.045,-120);
}
function bossPick(){
  const dx=(P.x+5)-(boss.x+boss.w/2);
  let opts=['beams','bomb','beams','bomb'];
  if(bossMinions()<2)opts.push('summon','summon');
  let a;
  if(Math.abs(dx)<62&&Math.random()<.78)a='melee';
  else{do{a=opts[Math.floor(Math.random()*opts.length)]}while(a===boss.last&&opts.length>1&&Math.random()<.8)}
  boss.last=a;boss.state=a;boss.t=0;boss.hitDone=false;boss.shots=0;boss.vx=0;
}
function updateBoss(dt){
  if(boss.kind==='bonez')return updateBonez(dt);
  if(boss.kind==='duo')return updateDuo(dt);
  if(boss.kind==='frank')return updateFrank(dt);
  if(boss.kind==='flora')return updateFlora(dt);
  if(boss.kind==='centaur')return updateCentaur(dt);
  if(boss.kind==='unity')return updateUnity(dt);
  if(boss.kind==='tram')return updateTram(dt);
  const B=boss,A=world.arena;
  if(!B.active||B.dead)return;
  B.flash=Math.max(0,B.flash-dt);
  if(B.hp<=0){
    B.deathT+=dt;
    if(Math.random()<.35)burst(B.x+Math.random()*B.w,B.y+Math.random()*B.h,10,Math.random()<.5?'#ffb020':'#ff3b30',150,.8);
    if(Math.random()<.1)sfx(80+Math.random()*80,.3,'sawtooth',.07,-40);
    G.shake=.25;
    if(B.deathT>2.4){
      B.dead=true;setExit(false);setDoor(false);Music.mode('run');
      for(const e of enemies.slice())if(e.minion)killEnemy(e);
      ebullets=[];bombs=[];
      burst(B.x+B.w/2,B.y+B.h/2,80,'#ffb020',220,1.2);G.flash=.6;
      toast(t('t.bossdead1'),4);bossLoot();
    }
    return;
  }
  const ts=B.hp<B.max/2?1.3:1;
  const dx=(P.x+5)-(B.x+B.w/2);
  if(B.state==='idle'){
    B.face=dx>=0?1:-1;
    B.cd-=dt*ts;
    B.vx=Math.abs(dx)>46?B.face*(20+(ts>1?10:0)):0;
    B.x+=B.vx*dt;B.x=clamp(B.x,A.x+8,A.x+A.w-B.w-8);
    if(B.cd<=0)bossPick();
  }else{
    B.t+=dt*ts;
    if(B.state==='melee'){
      if(B.t>=.45&&!B.hitDone){
        B.hitDone=true;G.shake=.3;sfx(100,.25,'sawtooth',.08,-50);
        const hb={x:B.face>0?B.x+B.w-4:B.x-38,y:B.y+10,w:42,h:44};
        burst(hb.x+(B.face>0?30:10),B.y+50,12,'#ffb020',120,.4);
        if(overlapR(hb,P))hurtPlayer(30,B.x+B.w/2);
      }
      if(B.t>=.95){B.state='idle';B.cd=.9}
    }else if(B.state==='beams'){
      if(B.t>=.6+B.shots*.25&&B.shots<3){
        const cx=B.x+B.w/2,cy=B.y+24,base=Math.atan2((P.y+6)-cy,(P.x+5)-cx);
        bossShoot(base+(B.shots-1)*.22);B.shots++;
      }
      if(B.t>=1.5){B.state='idle';B.cd=1.2}
    }else if(B.state==='summon'){
      if(B.t>=.8&&!B.hitDone){
        B.hitDone=true;sfx(180,.4,'square',.05,300);
        const xs=[A.x+3*T,A.x+A.w/2-6,A.x+A.w-4*T];
        xs.forEach(x=>{
          if(bossMinions()<3){
            enemies.push(makeEnemy({id:-1,type:'scrap',x:x,y:A.roof-13,min:A.x+6,max:A.x+A.w-6,minion:true}));
            burst(x+6,A.roof-8,12,'#ff9f1c',90,.5);
          }
        });
      }
      if(B.t>=1.3){B.state='idle';B.cd=1.6}
    }else if(B.state==='bomb'){
      if(B.t>=.6&&!B.hitDone){
        B.hitDone=true;
        const x0=B.x+B.w/2,y0=B.y+8,vy=-230,gy=700,yg=A.roof;
        const tt=(-vy+Math.sqrt(vy*vy+2*gy*(yg-y0)))/gy;
        bombs.push({x:x0,y:y0,vx:clamp(((P.x+5)-x0)/tt,-170,170),vy:vy,state:'fly',t:0,r:62,hit:false});
        sfx(200,.3,'square',.05,200);
      }
      if(B.t>=1){B.state='idle';B.cd=1.5}
    }
  }
}
function updateBombs(dt){
  for(let i=bombs.length-1;i>=0;i--){
    const b=bombs[i];b.t+=dt;
    if(b.state==='fly'){
      b.vy+=700*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
      if(b.vy>0&&pointSolid(b.x,b.y+4)){b.state='fuse';b.t=0;b.vx=b.vy=0}
    }else if(b.state==='fuse'){
      if(b.t>=.8){b.state='boom';b.t=0;G.shake=.4;G.flash=.25;if(b.bag)burst(b.x,b.y,24,'#7dff7a',180,.7);sfx(70,.5,'sawtooth',.09,-30);burst(b.x,b.y,40,'#ffb020',200,.6);burst(b.x,b.y,20,'#ff3b30',160,.6)}
    }else{
      if(!b.hit){
        const dx=(P.x+5)-b.x,dy=(P.y+6)-b.y;
        if(dx*dx+dy*dy<b.r*b.r){b.hit=true;hurtPlayer(b.dmg||30,b.x)}
      }
      if(b.t>=.3)bombs.splice(i,1);
    }
  }
}

/* ---------- projectiles, pickups, world logic ---------- */
function updateBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.x+=b.vx*dt;b.life-=dt;
    let dead=b.life<=0;
    if(!dead&&pointSolid(b.x+(b.vx>0?b.w:0),b.y+1)){dead=true;burst(b.x,b.y,4,'#c8ffe0',50,.2)}
    if(!dead){
      for(const e of enemies){
        if(e.spawnT>0)continue;
        if(overlapR(b,e)){
          if(e.type==='shield'&&b.vx*e.face<0){dead=true;burst(b.x,b.y,5,'#35e8ff',70,.25);sfx(1200,.05,'square',.03,-300);e.turnT=0;break}
          e.hp-=b.dmg;e.flash=.12;dead=true;burst(b.x,b.y,5,'#ffd23f',70,.25);sfx(500,.05,'square',.03,-200);
          if(e.hp<=0)killEnemy(e);
          break;
        }
      }
    }
    if(!dead&&boss.active&&!boss.dead&&boss.hp>0&&bossHit(b)){
      boss.hp-=b.dmg;boss.flash=.1;dead=true;burst(b.x,b.y,6,'#ffd23f',80,.3);sfx(380,.06,'square',.04,-150);
    }
    if(dead)bullets.splice(i,1);
  }
  for(let i=ebullets.length-1;i>=0;i--){
    const b=ebullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.g)b.vy+=b.g*dt;b.life-=dt;
    let dead=b.life<=0||pointSolid(b.x,b.y);
    if(!dead&&b.x>P.x-b.r&&b.x<P.x+P.w+b.r&&b.y>P.y-b.r&&b.y<P.y+P.h+b.r){hurtPlayer(b.dmg,b.x);dead=true}
    if(dead){burst(b.x,b.y,5,'#ff2bd6',60,.25);ebullets.splice(i,1)}
  }
}
function updateWorld(dt){
  pickupsUpdate();
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i];d.t+=dt;d.vy=Math.min(d.vy+500*dt,200);d.y+=d.vy*dt;
    if(pointSolid(d.x+5,d.y+10)){d.y=Math.floor((d.y+10)/T)*T-10;d.vy=0}
    if(overlapR(P,d)){if(d.kind==='pot'){P.dmgT=10;toast(t('t.pot'),2.4);sfx(780,.3,'triangle',.06,500);burst(P.x+5,P.y+6,20,'#ff4fd8',100,.6)}else if(d.kind==='item'){getItem(d.id)}else if(d.kind==='card'){getCard()}else{P.hp=Math.min(maxHP(),P.hp+20);toast('+20 HP',1);sfx(660,.15,'square',.04,300)}drops.splice(i,1)}
    else if(d.t>14&&d.kind!=='item')drops.splice(i,1);
  }
  /* checkpoints */
  for(const c of world.checks){
    if(!c.active&&overlapR(P,{x:c.x-8,y:c.y,w:c.w+16,h:c.h})){
      c.active=true;checkpoint=c;P.hp=Math.max(P.hp,Math.round(maxHP()*DIFFS[Cfg.diff].heal));
      snap=mkSnap();
      if(Cfg.slot>=0)saveGame(Cfg.slot);
      toast(t('t.cp'),2.4);sfx(520,.3,'triangle',.06,500);burst(c.x+8,c.y+10,20,'#35e8ff',100,.6);
    }
  }
  /* boss trigger */
  if(!boss.active&&!boss.dead&&!G.secret&&!world.hellArena&&P.x>world.arena.trigger){
    boss.active=true;setDoor(true);Music.mode(bossMusic());toast(t(boss.nameKey||'b.colossus'),2.6);sfx(110,.6,'sawtooth',.07,-30);G.shake=.4;
  }
  /* beacon */
  if(world.beacon&&boss.dead&&!Hell.on&&overlapR(P,world.beacon)){startCutscene()}
  /* zone */
  let z=0;for(let i=0;i<world.zoneX.length;i++)if(P.x>=world.zoneX[i])z=i;
  z=Math.min(z,world.nz-1);
  if(z>G.zone){G.zone=z;toast(t('t.sector',z+1,zname(z)),2.4)}
}
function step(dt){
  G.time+=dt;
  if(inFall()&&FALL.mode==='fall')updateFallPlayer(dt);else if(G.fair&&world.frank)updateAirPlayer(dt);else if(G.gflip)updateFlipPlayer(dt);else updatePlayer(dt);
  if(G.state!=='play')return;
  for(const e of enemies.slice()){
    const ex=e.ox!==undefined?e.ox:e.x;
    if(Math.abs(ex-P.x)>560&&!e.minion&&e.type!=='bird')continue;
    updateEnemy(e,dt);
  }
  updateBoss(dt);updateMini(dt);updateBombs(dt);updatePBombs(dt);updateSpecials(dt);updateBullets(dt);updateWorld(dt);updateHazards(dt);if(G.state==='play')updateP3(dt);hellStep(dt);secretStep(dt);updateWhips(dt);achStep();
}
function stepFx(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=220*dt;if(p.life<=0)parts.splice(i,1)}
  G.shake=Math.max(0,G.shake-dt);G.toastT=Math.max(0,G.toastT-dt);G.flash=Math.max(0,G.flash-dt);
  if(G.state==='dead'){

  txt(fmtTime(G.time),W-8,19,'#8c94b8','right');
  if(P.dmgT>0)txt(t('hud.dmg')+' '+Math.ceil(P.dmgT)+'s',W-8,30,'#ff4fd8','right');
  else if(world.theme<=3&&!Hell.on)txt(t(['','hud.chip','hud.seed','hud.gear'][world.theme])+' '+chipCount()+'/12',W-8,30,'#35e8ff','right');
  drawHUDExtra();
  /* boss bar */
  if(boss.active&&!boss.dead&&boss.kind!=='frank'&&!(boss.kind==='duo'&&boss.phase!=='fight')){
    drawBossBar(boss,Math.max(0,boss.hp)/boss.max,t(boss.nameKey||'b.colossus'),bossBarStyle(boss));
  }
  /* toast */
  if(G.toastT>0){ctx.globalAlpha=Math.min(1,G.toastT*2.5);txt(G.toast,W/2,46,'#ffd23f','center');ctx.globalAlpha=1}
  if(G.state==='dead'){
    ctx.fillStyle='#07060f';ctx.globalAlpha=Math.min(.7,G.deadT);ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
    if(G.deadT>.4)txt(t('hud.offline'),W/2,H/2-8,'#ff3b30','center');
  }
  if(G.flash>0){ctx.fillStyle='#fff';ctx.globalAlpha=Math.min(.8,G.flash*2);ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
  drawHud3();
}
function draw(){
  ctx.imageSmoothingEnabled=false;
  if(G.black){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);return}
  if(world.frank&&G.state!=='title'){const fx=G.shake>0?Math.round((Math.random()-.5)*G.shake*16):0,fy=G.shake>0?Math.round((Math.random()-.5)*G.shake*10):0;drawFrankScene(Math.round(cam.x)+fx,Math.round(cam.y)+fy);drawHUD();drawFade();return}
  if(inFall()&&G.state!=='title'){const fx=G.shake>0?Math.round((Math.random()-.5)*G.shake*16):0,fy=G.shake>0?Math.round((Math.random()-.5)*G.shake*10):0;drawFallScene(Math.round(cam.x)+fx,Math.round(cam.y)+fy);drawHUD();drawFade();return}
  if(G.secret&&world.secret&&G.state!=='title'){drawSecret(Math.round(cam.x),Math.round(cam.y));drawHUD();drawFade();return}
  const sx=G.shake>0?Math.round((Math.random()-.5)*G.shake*16):0,sy=G.shake>0?Math.round((Math.random()-.5)*G.shake*10):0;
  const cx=Math.round(cam.x)+sx,cy=Math.round(cam.y)+sy;
  const pal=palAt(cam.x+W/2);
  const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,pal.top);gr.addColorStop(1,pal.bot);
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  if(world.hellArena){drawHellBackdrop(cx,cy)}else if(world.theme===2){drawBackdrop2(cx,cy,pal)}else if(world.theme>=3){drawBackdrop34(cx,cy,pal)}else{
  /* stars */
  for(let i=0;i<46;i++){
    const sx2=Math.floor(hash2(i,1)*W),sy2=Math.floor(hash2(i,2)*110);
    ctx.fillStyle=(Math.floor(NOW*2+i)%7)?'#e8f7ee':'#6b78b8';ctx.globalAlpha=.55;ctx.fillRect((sx2-Math.round(cam.x*.03)%W+W)%W,sy2,1,1);ctx.globalAlpha=1;
  }
  tintedLayer(SKY_FAR,pal.far,.14,250-cam.y*.28);
  /* flying traffic */
  for(let i=0;i<7;i++){
    const sp=18+hash2(i,9)*26,dir=i%2?1:-1,px=(((hash2(i,5)*700)+NOW*sp*dir)%700+700)%700-150,py=40+hash2(i,6)*90;
    ctx.fillStyle=i%3?'#ffb020':'#ff4fd8';ctx.fillRect(Math.round(px),Math.round(py),3,1);
    ctx.globalAlpha=.35;ctx.fillRect(Math.round(px)-dir*6,Math.round(py),6,1);ctx.globalAlpha=1;
  }
  tintedLayer(SKY_MID,pal.mid,.34,270-cam.y*.5);}
  /* world */
  if(world.theme===2&&boss.kind==='flora')drawFloraBody(cx,cy);
  if(boss.kind==='unity'||boss.kind==='tram')drawUnityBody(cx,cy);
  for(const b of world.buildings){if(b.x+b.w<cx-4||b.x>cx+W+4)continue;if(world.hellArena)drawHellFloor(b,cx,cy);else if(world.theme===2)drawTree(b,cx,cy,pal);else if(world.theme>=3)drawBuilding34(b,cx,cy,pal);else drawBuilding(b,cx,cy,pal)}
  for(const d of world.decor)drawDecor(d,cx,cy,pal);
  if(world.hellArena)drawHellEnds(cx,cy);
  for(const p of world.plats){if(world.hellArena)drawHellPlat(p,cx,cy);else drawPlat(p,cx,cy,pal)}
  drawSpecials(cx,cy,pal);drawVendors(cx,cy);
  if(!world.hellArena)for(const c of world.checks)drawCheck(c,cx,cy);
  if(world.beacon)drawBeacon(cx,cy);
  if(world.door.closed)drawBarrier(world.door,cx,cy,pal);
  if(!boss.dead)drawBarrier(world.exitWall,cx,cy,pal);
  if(world.mini){if(world.mini.door.closed)drawBarrier(world.mini.door,cx,cy,pal);if(!killed.has('mini'+world.theme))drawBarrier(world.mini.exit,cx,cy,pal)}
  for(const k of world.pickups){
    if(collected.has(k.id))continue;
    if(abilOwned(k))continue;
    drawPickup(k,cx,cy);
  }
  for(const d of drops)drawDrop(d,Math.round(d.x-cx),Math.round(d.y-cy));
  for(const e of enemies)drawEnemy(e,cx,cy);drawArmor(cx,cy);
  drawBoss(cx,cy);drawMini(cx,cy);
  drawBombs(cx,cy);drawPBombs(cx,cy);drawHazards(cx,cy);drawP3(cx,cy);
  drawPlayer(cx,cy);drawWhips(cx,cy);
  for(const b of bullets)drawBullet(b,cx,cy);
  for(const b of ebullets){const x=Math.round(b.x-cx),y=Math.round(b.y-cy);ctx.fillStyle=b.col||'#ff2bd6';ctx.globalAlpha=.4;ctx.fillRect(Math.round(x-b.vx*.03)-2,Math.round(y-b.vy*.03)-2,5,5);ctx.globalAlpha=1;ctx.fillStyle=b.col||'#ff2bd6';ctx.fillRect(x-3,y-3,7,7);ctx.fillStyle='#fff';ctx.fillRect(x-1,y-1,3,3)}
  for(const p of parts){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.col;ctx.fillRect(Math.round(p.x-cx),Math.round(p.y-cy),p.sz,p.sz)}
  ctx.globalAlpha=1;
  if(secretFight())drawDivineLight();
  if(G.state!=='title')drawHUD();
  drawFade();
}

const DIFFS=[
  {id:'story',dmgIn:.5,hpMul:.8,heal:1,drop:1.5},
  {id:'normal',dmgIn:1,hpMul:1,heal:1,drop:1},
  {id:'hard',dmgIn:1.5,hpMul:1.25,heal:.75,drop:.8},
  {id:'apoc',dmgIn:2,hpMul:1.5,heal:.5,drop:.6}];
const Cfg={lang:'it',diff:1,slot:-1};
const WORLDS_READY=4;
const mem={};
function store(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}
function fetchS(k){try{const v=localStorage.getItem(k);if(v!==null)return v}catch(e){}return mem[k]!==undefined?mem[k]:null}
function loadCfg(){
  try{
    const o=JSON.parse(fetchS('rp_cfg')||'{}');
    if(LANGS.indexOf(o.lang)>=0)Cfg.lang=o.lang;
    if(typeof o.diff==='number'&&DIFFS[o.diff])Cfg.diff=o.diff;
    if(o.muted)muted=true;
  }catch(e){}
}
function saveCfg(){store('rp_cfg',JSON.stringify({lang:Cfg.lang,diff:Cfg.diff,muted:muted}))}
function readSlot(i){try{const s=fetchS('rp_slot'+i);if(!s)return null;const d=JSON.parse(s);return d&&d.v===2?d:null}catch(e){return null}}
function readProg(){if(TEST_NODMG)return 4;const v=parseInt(fetchS('rp_prog')||'1',10);return v>=1?v:1}
function unlock(n){if(n>readProg())store('rp_prog',String(n))}
function saveGame(i){
  try{
    const d={w:world.theme,cp:checkpoint.id,act:world.checks.filter(c=>c.active).map(c=>c.id),diff:Cfg.diff,time:Math.round(G.time),deaths:G.deaths,kills:G.kills,z:G.zone,
      v:2,abil:newAbil(P.abil),inv:{own:Inv.own,main:Inv.main,sec:Inv.sec,amu:Inv.amu,skin:Inv.skin,coins:snap.coins!==undefined?snap.coins:Inv.coins,plate:Inv.plate,colW:Inv.colW||{},scope:Inv.scope?1:0,mgw:Inv.mgw||{}},killed:Array.from(snap.killed),collected:Array.from(snap.collected),date:Date.now()};
    store('rp_slot'+i,JSON.stringify(d));
  }catch(e){}
}
function zoneOf(x){let z=0;for(let i=0;i<world.zoneX.length;i++)if(x>=world.zoneX[i])z=i;return Math.min(z,world.nz-1)}

/* ---------- game start ---------- */
function launch(o){
  Hell.on=false;Cfg.diff=o.diff;Cfg.slot=o.slot;saveCfg();
  hideOv();G.paused=false;
  In.left=In.right=In.jump=In.shoot=In.dash=In.up=In.down=0;In.jumpHit=In.dashHit=In.shootHit=In.bombHit=In.secHit=false;
  const L=o.load;
  const ab=L?L.abil:(o.world>=4?{dj:1,dash:1,charge:1,bomb:1,climb:1}:o.world>=3?{dj:1,dash:1,charge:1,bomb:1}:o.world>=2?{dj:1,dash:1}:{});
  Inv=freshInv();
  if(L&&L.inv){Inv.own=Object.assign({w_blaster:1,sk_green:1},L.inv.own);Inv.main=L.inv.main||'w_blaster';Inv.sec=L.inv.sec||null;Inv.amu=(L.inv.amu||[null,null]).slice(0,2);while(Inv.amu.length<2)Inv.amu.push(null);Inv.skin=L.inv.skin||'sk_green';Inv.coins=L.inv.coins||0;Inv.plate=!!L.inv.plate;Inv.colW=L.inv.colW||{};Inv.scope=L.inv.scope?1:0;Inv.mgw=L.inv.mgw||{}}
  G.inv=false;G.shop=false;
  buildWorld(o.world);G.black=false;G.card=false;cutKind=null;
  killed=new Set(L?L.killed:[]);collected=new Set(L?L.collected:[]);
  world.checks.forEach(c=>{c.active=L?L.act.indexOf(c.id)>=0:c.id==='c0'});
  checkpoint=(L&&world.checks.find(c=>c.id===L.cp))||world.checks[0];
  P=makePlayer();P.abil=newAbil(ab);
  P.x=checkpoint.spawnX;P.y=checkpoint.spawnY;P.safe={x:P.x,y:P.y};
  snap=mkSnap();
  boss=makeBossFor();setDoor(false);setExit(true);restoreArena();
  spawnAll();
  G.time=L?L.time:0;G.deaths=L?L.deaths:0;G.kills=L?L.kills:0;G.zone=zoneOf(P.x);G.shake=0;G.state='play';
  cam.x=P.x-W/2;cam.y=clamp(P.y-H/2,0,WH-H);
  Music.mode(worldMusic());Music.start();
  toast(world.theme>=2&&!L?t('t.worldN',world.theme,zname(0)):t('t.sector',G.zone+1,zname(G.zone)),2.8);
  unlock(o.world);
  if(Cfg.slot>=0)saveGame(Cfg.slot);
  sfx(440,.15,'square',.04,300);
}

/* ---------- menu ---------- */
let menuRedraw=null;
function btn(label,act,cls,dis){return '<button class="go '+(cls||'')+'" data-a="'+act+'"'+(dis?' disabled':'')+'>'+label+'</button>'}
function langRow(){
  return '<div class="langrow">'+LANGS.map(l=>'<button class="lang'+(l===Cfg.lang?' sel':'')+'" data-a="lang:'+l+'">'+LANG_LABEL[l]+'</button>').join('')+'</div>';
}
function setLang(l){Cfg.lang=l;saveCfg();applyStatic();if(menuRedraw)menuRedraw()}
function setMenu(html,acts,lite,redraw){
  menuRedraw=redraw||null;
  $('ov').classList.toggle('lite',!!lite);
  $('ovc').innerHTML=html;$('ov').hidden=false;
  $('ovc').querySelectorAll('button[data-a]').forEach(b=>{
    b.onclick=()=>{
      const a=b.dataset.a;
      if(a.indexOf('lang:')===0){setLang(a.slice(5));return}
      if(acts[a])acts[a]();
    };
  });
  const first=$('ovc').querySelector('button:not([disabled])');
  if(first)first.focus({preventScroll:true});
}
function focusMove(d){
  const bs=Array.from($('ovc').querySelectorAll('button:not([disabled])'));
  if(!bs.length)return;
  let i=bs.indexOf(document.activeElement);
  i=i<0?0:(i+d+bs.length)%bs.length;bs[i].focus();
}
function wname(n){return t('w'+n)}
function slotInfo(i){
  const d=readSlot(i);if(!d)return t('slot.empty');
  return t('slot.info',t('w'+d.w),d.z+1,t('diff.'+DIFFS[d.diff].id+'.n'),fmtTime(d.time));
}
function showMain(){
  G.gflip=false;setCanvasFX(null);world.frank=null;
  G.state='title';G.paused=false;Music.stop();G.toastT=0;G.black=false;cutKind=null;
  if(world.theme!==1){resetWorld();buildLevel();newGame();G.state='title'}
  Hell.on=false;
  const acts={new:()=>flowNew(1),load:showLoad,worlds:showWorlds,hell:()=>pickDiff(d=>startHell(d),showMain),ach:()=>showAch(),opt:()=>showOptions(showMain),book:()=>showBook(showMain)};
  setMenu('<h2>ROOFTOP PROTOCOL</h2><p class="dim">'+t('menu.tag')+'</p><div class="menu">'+
    btn(t('menu.new'),'new')+btn(t('menu.load'),'load','alt')+btn(t('menu.worlds'),'worlds','alt')+btn(t('menu.hell'),'hell','alt')+btn(t('menu.ach'),'ach','alt')+(hasBook()?btn('✦ '+t('menu.book'),'book','alt'):'')+btn(t('menu.options'),'opt','alt')+'</div>'+langRow(),acts,true,showMain);
}
function pickDiff(next,back){
  const acts={back:back};
  let h='<h2>'+t('diff.title')+'</h2><div class="menu">';
  DIFFS.forEach((d,i)=>{
    h+=btn('<b>'+t('diff.'+d.id+'.n')+'</b><br><span class="small">'+t('diff.'+d.id+'.d')+'</span>','d'+i,'slot'+(i===Cfg.diff?' sel':''));
    acts['d'+i]=()=>next(i);
  });
  h+=btn(t('menu.back'),'back','alt')+'</div>';
  setMenu(h,acts,true,()=>pickDiff(next,back));
}
function pickSlot(next,back,warn){
  const acts={back:back};
  let h='<h2>'+t('slot.title')+'</h2><div class="menu">';
  for(let i=0;i<3;i++){
    const d=readSlot(i);
    h+=btn('<b>'+t('slot.n',i+1)+'</b> '+(d&&warn?t('slot.over'):'')+'<br><span class="small">'+slotInfo(i)+'</span>','s'+i,'slot');
    acts['s'+i]=()=>next(i);
  }
  h+=btn(t('menu.back'),'back','alt')+'</div>';
  setMenu(h,acts,true,()=>pickSlot(next,back,warn));
}
function flowNew(w){
  pickDiff(d=>pickSlot(s=>launch({world:w,diff:d,slot:s}),()=>flowNew(w),true),w===1?showMain:showWorlds);
}
function showLoad(){
  const acts={back:showMain};
  let h='<h2>'+t('load.title')+'</h2><div class="menu">',any=false;
  for(let i=0;i<3;i++){
    const d=readSlot(i);if(d)any=true;
    h+=btn('<b>'+t('slot.n',i+1)+'</b><br><span class="small">'+slotInfo(i)+'</span>','s'+i,'slot',!d);
    acts['s'+i]=()=>{const L=readSlot(i);if(L)launch({world:L.w,diff:L.diff,slot:i,load:L})};
  }
  if(!any)h+='<p class="dim">'+t('load.none')+'</p>';
  h+=btn(t('menu.back'),'back','alt')+'</div>';
  setMenu(h,acts,true,showLoad);
}
function showWorlds(){
  const prog=readProg(),acts={back:showMain};
  let h='<h2>'+t('world.title')+'</h2><div class="menu">';
  for(let n=1;n<=4;n++){
    const ok=n<=prog&&n<=WORLDS_READY;
    h+=btn('<b>'+t('world.n',n)+'</b> '+wname(n)+(ok?'':'<br><span class="small">'+(n>WORLDS_READY?t('world.soon'):t('world.locked'))+'</span>'),'w'+n,'slot',!ok);
    acts['w'+n]=()=>flowNew(n);
  }
  h+=btn(t('menu.back'),'back','alt')+'</div>';
  setMenu(h,acts,true,showWorlds);
}
function showOptions(back){
  const acts={back:back,fs:()=>{toggleFS();setTimeout(()=>showOptions(back),150)},au:()=>{muted=!muted;saveCfg();showOptions(back)}};
  const h='<h2>'+t('opt.title')+'</h2><p class="dim">'+t('menu.lang')+'</p>'+langRow()+'<div class="menu">'+
    btn(t('menu.fs')+': '+(fsEl()?'ON':'OFF'),'fs','alt')+btn(t('menu.audio')+': '+(muted?'OFF':'ON'),'au','alt')+btn(t('menu.back'),'back')+'</div>'+
    '<p class="dim small">'+t('opt.pad')+'</p>';
  setMenu(h,acts,G.state==='title',()=>showOptions(back));
}
function showPause(){
  const acts={resume:()=>setPause(false),save:()=>{if(Cfg.slot>=0){saveGame(Cfg.slot);toast(t('t.saved'),1.8)}setPause(false)},opt:()=>showOptions(showPause),main:()=>{G.paused=false;showMain()},back:()=>setPause(false)};
  setMenu('<h2>'+t('pause')+'</h2><p class="dim small">'+t('pause.note')+'</p><div class="menu">'+
    btn(t('menu.resume'),'resume')+btn(t('menu.save'),'save','alt')+btn(t('menu.options'),'opt','alt')+btn(t('menu.main'),'main','alt')+'</div>',acts,false,showPause);
}
function setPause(p){
  if(G.state!=='play'&&!(G.paused&&!p))return;
  G.paused=p;if(!p){G.inv=false;G.shop=false}

/* ---------- controller (Gamepad API, works with DS4Windows / XInput) ---------- */
const GP={on:false,prev:{},pg:{}};
function pollPad(){
  /* read ALL connected pads (DS4Windows can expose two) and merge their input */
  const pads=[];
  try{const l=navigator.getGamepads?navigator.getGamepads():[];for(const p of l){if(p&&p.connected)pads.push(p)}}catch(e){}
  if(!pads.length){GP.on=false;GP.navDir=0;return}
  if(!GP.on){GP.on=true;toast(t('t.pad'),2)}
  const now=performance.now()/1000,pdt=Math.min(.1,now-(GP.lt||now));GP.lt=now;
  const K=['left','right','up','down','a','b','x','rb','rt','start','y','lb','back','nl','nr','nu','nd'],s={};
  for(const k of K)s[k]=false;
  for(const gp of pads){
    const bt=i=>!!(gp.buttons[i]&&(gp.buttons[i].pressed||gp.buttons[i].value>.5)),ax=gp.axes[0]||0,ay=gp.axes[1]||0;
    const o={left:bt(14)||ax<-.45,right:bt(15)||ax>.45,up:bt(12)||ay<-.6,down:bt(13)||ay>.6,a:bt(0),b:bt(1),x:bt(2),rb:bt(5),rt:bt(7),start:bt(9),y:bt(3),lb:bt(4),back:bt(8)};
    /* menus: only the dominant stick axis counts, so a diagonal push does not cancel itself out */
    const big=Math.hypot(ax,ay)>.5,hor=Math.abs(ax)>Math.abs(ay);
    o.nl=bt(14)||(big&&hor&&ax<0);o.nr=bt(15)||(big&&hor&&ax>0);o.nu=bt(12)||(big&&!hor&&ay<0);o.nd=bt(13)||(big&&!hor&&ay>0);
    for(const k of K)if(o[k])s[k]=true;
  }
  const edge=k=>s[k]&&!GP.prev[k];
  const menu=!$('ov').hidden&&G.state!=='cut';
  /* menu navigation with auto-repeat while held */
  const nY=(s.nd?1:0)-(s.nu?1:0),nX=(s.nr?1:0)-(s.nl?1:0),nav=nY||nX;
  if(nav!==GP.navDir){GP.navDir=nav;GP.navT=.38;if(nav&&menu)focusMove(nav)}
  else if(nav&&menu){GP.navT-=pdt;if(GP.navT<=0){GP.navT=.13;focusMove(nav)}}
  if(menu){
    if(edge('a')){const f=document.activeElement;if(f&&f.tagName==='BUTTON'&&$('ovc').contains(f))f.click()}
    if(edge('b')){const bk=$('ovc').querySelector('[data-a=back]');if(bk)bk.click()}
  }else if(G.state==='cut'){
    if(edge('a'))skipCut();
  }else if(G.state==='scope'){
    if(edge('a')||edge('b'))skipScope();
  }
  if(edge('start')&&(G.state==='play'||G.paused))togglePause();
  if(edge('back')&&(G.state==='play'||G.inv||G.shop))toggleInv();
  if(G.state==='play'&&!G.paused){if(edge('y'))In.secHit=true;if(edge('lb'))In.bombHit=true;if(edge('up'))tryInteract();In.up=s.up?1:0;In.down=s.down?1:0}
  const g={left:s.left,right:s.right,jump:s.a,shoot:s.x||s.rt,dash:s.b||s.rb};
  const playing=G.state==='play'&&!G.paused;
  for(const k in g){
    const on=playing&&g[k],was=!!GP.pg[k];
    if(on&&!was)press(k);
    if(!on&&was)release(k);
    GP.pg[k]=on;
  }
  GP.prev=s;
}

/* ---- skins: recolour the player sprites ---- */
const _skinCache={};
function recolorPack(pk,map){
  const c=pk.r,w=c.width,h=c.height,g=c.getContext('2d'),d=g.getImageData(0,0,w,h),px=d.data;
  const from=[],to=[];
  for(const k in map){from.push(hexRgb(PLP[k]));to.push(hexRgb(map[k]))}
  for(let i=0;i<px.length;i+=4){
    if(!px[i+3])continue;
    for(let j=0;j<from.length;j++){
      const f=from[j];
      if(px[i]===f[0]&&px[i+1]===f[1]&&px[i+2]===f[2]){px[i]=to[j][0];px[i+1]=to[j][1];px[i+2]=to[j][2];break}
    }
  }
  const o=document.createElement('canvas');o.width=w;o.height=h;o.getContext('2d').putImageData(d,0,0);
  return pack(o);
}
function skinSet(){
  const id=Inv.skin,m=SKIN_PAL[id];

}

const MINI_Z={1:7,2:4,3:5,4:4};
const COL_ID={1:'chip',2:'seed',3:'gear'};
const COL_KINDS=['high','vault','tramp','crumble'];
const COL2=[[1,3],[2,3],[3,3],[3,7],[4,3],[5,3],[6,3],[6,7],[7,3],[8,3],[8,7],[9,3]];
function colAt(theme,z,i){
  if(theme===1)return(z>=3&&z<=14&&i===3)?z-3:-1;
  if(theme===2||theme===3){for(let k=0;k<COL2.length;k++)if(COL2[k][0]===z&&COL2[k][1]===i)return k}
  return -1;
}
function addSolid(S,o){S.solids.push(o);return o}
function addSpecial(S,o){S.specials.push(o);return o}
function trimDecor(S,x0,x1){S.decor=S.decor.filter(d=>!(d.x>=x0-T&&d.x<=x1+T&&d.y>0&&Math.abs(d.y-S._ry)<2))}

function buildCollectible(S,b,kind,idx,theme){
  const id=COL_ID[theme]+idx,wt=Math.floor(b.w/T);

  if(kind==='high'){

    addSpecial(S,addSolid(S,{x:x0,y:b.y-(3*T-8),w:T,h:3*T-8,brk:true,hp:60,mhp:60,bid:S.wallN++,kind:'brk',flash:0}));
    addSpecial(S,addSolid(S,{x:x0+3*T,y:b.y-3*T,w:T,h:3*T,kind:'pillar'}));
    addSpecial(S,addSolid(S,{x:x0,y:b.y-3*T,w:4*T,h:8,kind:'slab'}));
    cx=x0+2*T-5;cy=b.y-14;
  }else if(kind==='tramp'){
    const x1=b.x+2*T;
    trimDecor(S,x1,x1+6*T);
    addSpecial(S,addSolid(S,{x:x1,y:b.y-8,w:2*T,h:8,tramp:true,kind:'tramp',sq:0}));
    const py=b.y-8-88,px=x1+2*T;
    const p={x:px,y:py,w:3*T,h:T/2,plat:true,colP:true};S.plats.push(p);S.solids.push(p);
    cx=px+3*T/2-5;cy=py-12;
  }else{
    trimDecor(S,b.x+T,b.x+10*T);
    let lastp=null;
    for(let k=0;k<3;k++){
      const p={x:b.x+(1+k*3)*T,y:b.y-28*(k+1),w:2*T,h:8,plat:true,colP:true,crumble:true,kind:'crumble',state:0,tm:0,fy:0,vy:0,k:0};
      addSpecial(S,addSolid(S,p));lastp=p;
    }
    cx=lastp.x+T-5;cy=lastp.y-12;
  }
  S.pickups.push({id:id,kind:COL_ID[theme],x:cx,y:cy,w:10,h:10});
}

/* called by the level generators after every building */
function featureHook(S,b,z,i,nB,isCheck){
  const th=S.theme;
  const ci=colAt(th,z,i);
  if(ci>=0){b.colk=COL_KINDS[ci%4];buildCollectible(S,b,b.colk,ci,th)}
  if(th===2&&i===nB-1&&z===3)S.pickups.push({id:'charge',kind:'charge',x:b.x+b.w/2-6,y:b.y-20,w:12,h:12});
  if(th===3&&i===nB-1&&z===1)S.pickups.push({id:'climb',kind:'climb',x:b.x+b.w/2-6,y:b.y-20,w:12,h:12});
  if(th===2&&i===nB-1&&z===6)S.pickups.push({id:'bomb',kind:'bomb',x:b.x+b.w/2-6,y:b.y-20,w:12,h:12});
  /* crumbling platform in long gaps (optional extra, never required) */
  const pb=S.buildings[S.buildings.length-2];
  if(pb&&!isCheck&&!b.colk&&!b.sp&&!pb.pillar&&!pb.tower){
    S.hr=S.hr||mulberry32(th*977+13);
    const gap=b.x-(pb.x+pb.w);
    if(gap>=5*T&&S.hr()<.4){
      const py=Math.min(pb.y,b.y)+T;
      addSpecial(S,addSolid(S,{x:pb.x+pb.w+Math.floor((gap/T-2)/2)*T,y:py,w:2*T,h:8,plat:true,crumble:true,kind:'crumble',state:0,tm:0,fy:0,vy:0,k:0}));
    }
  }
}

function miniDoor(closed){

  const i=world.solids.indexOf(M.door);
  if(closed&&i<0)world.solids.push(M.door);

/* ---------- specials : state, update ---------- */
function solidAt(x,y){for(const s of world.solids){if(x>=s.x&&x<s.x+s.w&&y>=s.y&&y<s.y+s.h)return s}return null}
function resetSpecials(){
  for(const s of world.specials){
    if(s.kind==='lift'||s.kind==='vent'||s.kind==='neon'){resetSpecial1(s);continue}
    if(s.kind==='crumble'){s.state=0;s.tm=0;s.fy=0;s.vy=0;if(world.solids.indexOf(s)<0)world.solids.push(s)}
    else if(s.kind==='tramp')s.sq=0;
    else if(s.kind==='brk'){
      const gone=killed.has('w'+s.bid),i=world.solids.indexOf(s);
      s.hp=s.mhp;s.broken=gone;
      if(gone&&i>=0)world.solids.splice(i,1);
      if(!gone&&i<0)world.solids.push(s);
    }
  }
  miniDoor(false);
  miniExit(!!world.mini&&!killed.has('mini'+world.theme));
}
function breakWall(s){
  const i=world.solids.indexOf(s);if(i>=0)world.solids.splice(i,1);
  s.broken=true;killed.add('w'+s.bid);
  for(let k=0;k<26;k++)parts.push({x:s.x+Math.random()*s.w,y:s.y+Math.random()*s.h,vx:(Math.random()-.5)*110,vy:-Math.random()*90,life:1.1,max:1.1,col:k%3?'#8a6a55':'#c9b49a',sz:Math.random()<.5?3:2});
  G.shake=Math.max(G.shake,.25);sfx(110,.35,'sawtooth',.07,-60);
  toast(t('t.wall'),1.2);
}
function brkHit(s,dmg){
  if(!s.brk||s.broken)return;
  s.hp-=dmg;s.flash=.1;burst(s.x+s.w/2,s.y+s.h/2,4,'#c9b49a',50,.3);
  if(s.hp<=0)breakWall(s);
}
function wallsInRadius(x,y,r,dmg){
  for(const s of world.specials)if(s.brk&&!s.broken){
    const dx=clamp(x,s.x,s.x+s.w)-x,dy=clamp(y,s.y,s.y+s.h)-y;
    if(dx*dx+dy*dy<=r*r)brkHit(s,dmg);
  }
}
function updateSpecials(dt){
  for(const s of world.specials){
    if(s.kind==='lift'||s.kind==='vent'||s.kind==='neon'){updateSpecials1(s,dt);continue}
    if(s.kind==='tramp'){if(s.sq>0)s.sq-=dt;continue}
    if(s.kind==='brk'){if(s.flash>0)s.flash-=dt;continue}
    if(s.kind!=='crumble')continue;
    if(s.state===0){
      if(P.ground===s&&!P.dead){s.state=1;s.tm=0;sfx(200,.1,'square',.03,-40)}
    }else if(s.state===1){
      s.tm+=dt;
      if(s.tm>=3){
        s.state=2;s.tm=0;s.fy=0;s.vy=0;
        const i=world.solids.indexOf(s);if(i>=0)world.solids.splice(i,1);
        burst(s.x+s.w/2,s.y+4,10,'#c9b49a',70,.5);sfx(120,.25,'sawtooth',.05,-60);
      }
    }else{
      s.tm+=dt;s.vy=Math.min(s.vy+600*dt,300);s.fy+=s.vy*dt;

      }
    }
  }
}

/* =====================  MINIBOSSES  ===================== */
let mini=null;
let miniWaves=[];
function makeMini(){
  const M=world.mini;if(!M||killed.has('mini'+world.theme))return null;
  const th=M.theme,w=th===1?26:th===4?26:30,h=th===1?27:th===2?28:th===3?30:42;
  const hp=Math.round(500*DIFFS[Cfg.diff].hpMul);
  return{theme:th,x:M.x+M.w-8*T,y:M.roof-h,w:w,h:h,vx:0,vy:0,hp:hp,max:hp,state:'idle',t:0,cyc:0,flash:0,face:-1,active:false,dead:false,ground:null,deathT:0,hitDone:false,wind:0,anim:0};
}
function spawnMini(){mini=makeMini();miniWaves=[]}
function miniName(){return t('b.mini'+(mini?mini.theme:world.theme))}
function miniStart(){
  mini.active=true;miniDoor(true);
  Music.mode(bossMusic());
  toast(miniName(),2.4);sfx(120,.5,'sawtooth',.07,-30);G.shake=.3;
}
function miniNext(m,st,t0){m.state=st;m.t=0;m.hitDone=false}
function updateMini(dt){
  const m=mini,M=world.mini;
  if(!m||m.dead||!M)return;
  if(!m.active){if(!G.secret&&P.x>M.trigger&&P.y<M.roof+40)miniStart();return}
  m.flash=Math.max(0,m.flash-dt);m.anim+=dt;
  if(m.hp<=0){
    m.deathT+=dt;
    if(Math.random()<.4)burst(m.x+Math.random()*m.w,m.y+Math.random()*m.h,8,Math.random()<.5?'#ffb020':'#ff3b30',140,.7);
    if(Math.random()<.1)sfx(80+Math.random()*80,.25,'sawtooth',.06,-40);
    G.shake=.2;
    if(m.deathT>1.8){
      m.dead=true;killed.add('mini'+m.theme);if(typeof jrAdd==='function')jrAdd('mini'+m.theme);
      miniDoor(false);miniExit(false);Music.mode(worldMusic());
      miniWaves=[];ebullets=[];
      burst(m.x+m.w/2,m.y+m.h/2,60,'#ffb020',200,1);G.flash=.4;
      rollMiniLoot(m.x+m.w/2,m.y+m.h);
      drops.push({x:m.x+m.w/2+10,y:m.y+m.h-10,w:10,h:10,vy:-90,t:0,kind:'hp'});
      toast(t('t.minidead'),3);
    }
    return;
  }
  const ts=m.hp<m.max/2?1.25:1;
  const pcx=P.x+5,mcx=m.x+m.w/2,dx=pcx-mcx;
  m.t+=dt*ts;
  if(m.theme!==2)updateMiniScrap(m,dt,ts,dx);else updateMiniPlant(m,dt,ts,dx);
  /* ground waves */
  for(let i=miniWaves.length-1;i>=0;i--){
    const w=miniWaves[i];w.x+=w.vx*dt;w.life-=dt;
    const r={x:w.x-6,y:w.y-10,w:12,h:10};
    if(overlapR(r,P))hurtPlayer(20,w.x);
    if(w.life<=0||pointSolid(w.x+(w.vx>0?6:-6),w.y-4))miniWaves.splice(i,1);
  }
}
function miniPhys(m,dt,grav){
  m.vy=Math.min(m.vy+(grav||GRAV)*dt,MAXFALL);
  moveBody(m,dt);
  const M=world.mini;
  m.x=clamp(m.x,M.x+8,M.x+M.w-m.w-8);
}
function updateMiniScrap(m,dt,ts,dx){
  const M=world.mini;
  if(m.state==='idle'){m.state='chase';m.t=0;m.cyc=0}
  if(m.state==='chase'){
    m.face=dx>=0?1:-1;m.vx=m.face*(42*ts);
    if(Math.abs(dx)<18)m.vx=0;
    miniPhys(m,dt);
    if(overlapR(m,P))hurtPlayer(m.theme===3?40:30,m.x+m.w/2);
    if(m.t>1.5){m.cyc++;miniNext(m,m.cyc%3===0?'swind':'wind')}
  }else if(m.state==='wind'){
    m.vx=0;m.wind=m.t;miniPhys(m,dt);
    if(m.t<.12)m.face=dx>=0?1:-1;
    if(m.t>.6){miniNext(m,'dash');sfx(200,.3,'sawtooth',.06,200)}
  }else if(m.state==='dash'){
    m.vx=m.face*200*ts;miniPhys(m,dt);
    if(overlapR(m,P))hurtPlayer(30,m.x+m.w/2);
    if(m.wall||m.t>.55){m.vx=0;miniNext(m,'rest');G.shake=.2}
  }else if(m.state==='swind'){
    m.vx=0;miniPhys(m,dt);m.face=dx>=0?1:-1;
    if(m.t>.55){m.vy=-270;m.vx=m.face*Math.min(110,Math.abs(dx)*1.3);miniNext(m,'jump');sfx(300,.2,'square',.05,300)}
  }else if(m.state==='jump'){
    miniPhys(m,dt);
    if(overlapR(m,P))hurtPlayer(30,m.x+m.w/2);
    if(m.ground&&m.t>.2){
      m.vx=0;G.shake=.4;sfx(70,.4,'sawtooth',.08,-30);burst(m.x+m.w/2,m.y+m.h,16,'#c9b49a',110,.5);
      miniWaves.push({x:m.x+m.w/2,y:m.y+m.h,vx:-150,life:.6},{x:m.x+m.w/2,y:m.y+m.h,vx:150,life:.6});
      miniNext(m,'rest');
    }
  }else if(m.state==='rest'){
    m.vx=0;miniPhys(m,dt);
    if(m.t>1)miniNext(m,'chase');
  }
}
function updateMiniPlant(m,dt,ts,dx){
  if(m.state==='idle'){m.state='hop';m.t=0;m.cyc=0}
  m.face=dx>=0?1:-1;
  if(m.state==='hop'){
    if(m.ground){
      m.vx=0;
      if(m.t>1.1){
        m.cyc++;
        if(m.cyc%3===0)miniNext(m,'spray');
        else if(Math.abs(dx)<90)miniNext(m,'bwind');
        else{m.vy=-230;m.vx=m.face*85*ts;m.t=0;sfx(250,.15,'square',.04,200)}
      }
    }
    miniPhys(m,dt,800);
    if(overlapR(m,P)&&P.inv<=0)hurtPlayer(30,m.x+m.w/2);
  }else if(m.state==='bwind'){
    m.vx=0;m.wind=m.t;miniPhys(m,dt);
    if(m.t>.65){miniNext(m,'bite');sfx(150,.2,'sawtooth',.06,-60)}
  }else if(m.state==='bite'){
    m.vx=0;miniPhys(m,dt);
    if(!m.hitDone&&m.t>.08){
      m.hitDone=true;G.shake=.3;
      const hb={x:m.face>0?m.x+m.w-6:m.x-34,y:m.y-4,w:40,h:m.h+6};
      burst(hb.x+20,m.y+m.h/2,10,'#ff4fd8',100,.4);
      if(overlapR(hb,P))hurtPlayer(60,m.x+m.w/2);
    }
    if(m.t>.55){miniNext(m,'rest')}
  }else if(m.state==='spray'){
    m.vx=0;miniPhys(m,dt);
    if(m.t>.5&&!m.hitDone){
      m.hitDone=true;sfx(560,.25,'triangle',.05,-250);
      const cx=m.x+m.w/2,cy=m.y+6,base=Math.atan2((P.y+6)-cy,(P.x+5)-cx);
      for(let k=-2;k<=2;k++){const a=base+k*.2;ebullets.push({x:cx,y:cy,vx:Math.cos(a)*115,vy:Math.sin(a)*115,r:3,dmg:20,life:3,col:'#c8f560'})}
    }
    if(m.t>1.1)miniNext(m,'rest');
  }else if(m.state==='rest'){
    m.vx=0;miniPhys(m,dt);
    if(m.t>.9)miniNext(m,'hop');
  }
}

    if(m.state==='bwind'){ctx.globalAlpha=.25;ctx.fillStyle='#ff3b30';ctx.fillRect(Math.round((m.face>0?m.x+m.w-6:m.x-34)-cx),y-4,40,m.h+6);ctx.globalAlpha=1}

/* ---------- shared damage ---------- */
function hitEnemy(e,dmg){
  e.hp-=dmg;e.flash=.12;
  if(e.hp<=0)killEnemy(e);
}
function hitBossDmg(dmg){
  boss.hp-=dmg;boss.flash=.1;
}
function bossInRadius(x,y,r){
  if(!boss.active||boss.dead||boss.hp<=0)return false;
  if(boss.kind==='frank'){const dx=boss.x+boss.w/2-x,dy=boss.y+boss.h/2-y;if(dx*dx+dy*dy<(r+14)*(r+14))frankDeflect(null);return false}
  if(boss.kind==='flora'){
    for(const h of boss.hands){const dx=h.x+h.w/2-x,dy=h.y+h.h/2-y;if(dx*dx+dy*dy<(r+14)*(r+14)){h.flash=.1;return true}}
    const A=world.arena,dx=A.x+A.w/2-x;return Math.abs(dx)<r*.5&&false;
  }
  const dx=boss.x+boss.w/2-x,dy=boss.y+boss.h/2-y;return dx*dx+dy*dy<(r+26)*(r+26);
}
function areaDamage(x,y,r,dmg,opt){
  opt=opt||{};
  for(const e of enemies.slice()){
    if(e.spawnT>0)continue;
    const dx=e.x+e.w/2-x,dy=e.y+e.h/2-y,rr=r+Math.max(e.w,e.h)/2;
    if(dx*dx+dy*dy<=rr*rr){
      hitEnemy(e,dmg);
      if(opt.knock&&e.hp>0&&e.vx!==undefined){e.x+=Math.sign(dx||1)*10}
      burst(e.x+e.w/2,e.y+e.h/2,5,'#ffd23f',70,.3);
    }
  }
  if(mini&&mini.active&&!mini.dead&&mini.hp>0){
    const dx=mini.x+mini.w/2-x,dy=mini.y+mini.h/2-y,rr=r+mini.w/2;
    if(dx*dx+dy*dy<=rr*rr){mini.hp-=dmg;mini.flash=.12;burst(mini.x+mini.w/2,mini.y+mini.h/2,6,'#ffd23f',80,.3)}
  }
  if(bossInRadius(x,y,r)){hitBossDmg(dmg);burst(x,y,6,'#ffd23f',80,.3)}
  wallsInRadius(x,y,opt.wall||r*.7,100);
}

/* ---------- weapons ---------- */
function fireMain(mult){
  const p=P,w=ITEMS[Inv.main],dm=dmgMul(),mx=p.x+5+p.face*9,my=p.y+5;
  const f=p.face;
  const mk=(o)=>bullets.push(Object.assign({x:mx,y:my,w:7,h:3,vx:f*320,vy:0,life:.65,dmg:20,kind:'n',col:'#e8ffe9'},o));
  if(mult>1){
    const vol=(Inv.main==='w_twin'?2:Inv.main==='w_scatter'?3:1)*w.dmg;
    mk({y:my-2,w:13,h:7,vx:f*300,life:.85,dmg:Math.round(vol*5*dm),kind:'ch',col:'#ffc2f0',pierce:Inv.main==='w_rail'||Inv.main==='w_zephor',hits:new Set()});
    p.shootCd=.35;sfx(300,.3,'sawtooth',.06,500);G.shake=Math.max(G.shake,.08);
    burst(mx,my,10,'#ffc2f0',90,.35);
    return;
  }
  if(Inv.main==='w_tartarus'){whipFire(dm);p.shootCd=w.cd;return}
  switch(Inv.main){
    case'w_twin':mk({y:my-3,dmg:Math.round(12*dm)});mk({y:my+3,dmg:Math.round(12*dm)});break;
    case'w_scatter':for(const a of[-50,0,50])mk({vx:f*300,vy:a,life:.38,dmg:Math.round(10*dm),col:'#ffd23f'});break;
    case'w_rail':mk({vx:f*470,w:14,life:.8,dmg:Math.round(45*dm),pierce:true,hits:new Set(),col:'#35e8ff',kind:'rail'});break;
    case'w_zephor':mk({vx:f*430,w:16,life:.9,dmg:Math.round(35*dm),pierce:true,hits:new Set(),col:'#ffd23f',kind:'rail'});break;
    case'w_rapid':mk({vx:f*340,dmg:Math.round(9*dm),col:'#ffb020'});break;
    default:mk({dmg:Math.round(20*dm)});
  }
  p.shootCd=w.cd;
  sfx(Inv.main==='w_rail'?500:900,.07,'square',.03,-500);
}
function trySecondary(){
  const p=P,id=Inv.sec;
  if(!id||p.dead||p.secCd>0||p.dashT>0)return;

}
const pbombs=[];
function tryBomb(){
  const p=P;
  if(!p.abil.bomb||p.dead||p.dashT>0)return;
  if(p.bombCd>0){toast(t('t.nobomb'),.8);return}
  p.bombCd=6;
  pbombs.push({x:p.x+5+p.face*14,y:p.y+4,vx:p.face*70,vy:-60,t:0,state:'fly',ground:false});
  sfx(260,.12,'square',.04,-100);
}
function updatePBombs(dt){
  for(let i=pbombs.length-1;i>=0;i--){
    const b=pbombs[i];b.t+=dt;
    if(b.state==='fly'){
      b.vy=Math.min(b.vy+700*dt,260);
      let nx=b.x+b.vx*dt;
      if(solidAt(nx,b.y)){b.vx=0;nx=b.x}
      b.x=nx;
      const ny=b.y+b.vy*dt;
      if(b.vy>0&&solidAt(b.x,ny+4)){b.vy=0;b.vx=0;b.state='rest';b.y=Math.floor((ny+4)/T)*T;const s=solidAt(b.x,ny+4);if(s)b.y=s.y-4}
      else b.y=ny;
      if(b.y>WH+40){pbombs.splice(i,1);continue}
    }
    if(b.t>=3){
      const dmg=50+(hasAmu('a_coil')?30:0);
      areaDamage(b.x,b.y,190,dmg,{wall:120});
      G.shake=.5;G.flash=.35;sfx(60,.6,'sawtooth',.1,-30);
      burst(b.x,b.y,50,'#ffb020',230,.8);burst(b.x,b.y,30,'#fff2c0',150,.6);
      pbombs.splice(i,1);
      b.boom=1;pboom.push({x:b.x,y:b.y,t:0});
    }
  }
  for(let i=pboom.length-1;i>=0;i--){pboom[i].t+=dt;if(pboom[i].t>.4)pboom.splice(i,1)}
}
const pboom=[];
function drawPBombs(cx,cy){
  for(const b of pbombs){

    ctx.fillStyle='#0d1126';ctx.fillRect(x-4,y-4,8,8);ctx.fillStyle='#3a8f6a';ctx.fillRect(x-3,y-3,6,6);

    ctx.fillStyle='#e8f7ee';ctx.fillRect(x-1,y-6,2,2);
    ctx.fillStyle='#ffd23f';ctx.fillRect(x+2,y-8+(Math.floor(NOW*20)%2),1,2);
    if(b.t>2){ctx.globalAlpha=.12+pulse*.1;ctx.strokeStyle='#ff3b30';ctx.beginPath();ctx.arc(x,y,190*(.2+(b.t-2)*.1),0,6.283);ctx.stroke();ctx.globalAlpha=1}
  }
  for(const e of pboom){
    const k=e.t/.4,x=Math.round(e.x-cx),y=Math.round(e.y-cy);
    ctx.globalAlpha=(1-k)*.55;ctx.fillStyle='#ffb020';ctx.beginPath();ctx.arc(x,y,190*(.3+k*.7),0,6.283);ctx.fill();

/* ---------- player ---------- */
function wallSide(p){
  const y1=p.y+3,y2=p.y+10;
  if(pointSolid(p.x-1.5,y1)||pointSolid(p.x-1.5,y2))return -1;
  if(pointSolid(p.x+p.w+1.5,y1)||pointSolid(p.x+p.w+1.5,y2))return 1;
  return 0;
}
function updatePlayer(dt){
  const p=P;
  p.inv=Math.max(0,p.inv-dt);p.kb=Math.max(0,p.kb-dt);p.dmgT=Math.max(0,p.dmgT-dt);p.shootCd-=dt;p.dashCd-=dt;p.buf-=dt;p.anim+=dt;
  p.secCd=Math.max(0,p.secCd-dt);p.bombCd=Math.max(0,p.bombCd-dt);p.mantle=Math.max(0,p.mantle-dt);p.pulseT=Math.max(0,(p.pulseT||0)-dt);
  if(In.jumpHit){p.buf=.12;In.jumpHit=false}
  const dir=(In.right?1:0)-(In.left?1:0);
  if(dir&&p.dashT<=0&&p.kb<=0&&!p.cling)p.face=dir;
  const spd=RUN*(hasAmu('a_boots')?1.12:1)*(p.slowT>0?.55:1);
  if(In.dashHit){
    In.dashHit=false;
    if(p.abil.dash&&p.dashCd<=0&&p.dashT<=0){p.dashT=.18;p.dashCd=.65*(hasAmu('a_cap')?.65:1);p.inv=Math.max(p.inv,.22);p.cling=false;sfx(300,.15,'sawtooth',.05,400);burst(p.x+5,p.y+7,8,'#35e8ff',60,.3)}
  }
  if(In.bombHit){In.bombHit=false;tryBomb()}
  if(In.secHit){In.secHit=false;trySecondary()}
  /* wall climbing */
  const maxE=climbMax();
  if(p.ground){p.energy=Math.min(maxE,p.energy+38*dt);p.cling=false;p.climbLock=false}
  const canClimb=p.abil.climb&&!p.ground&&p.dashT<=0&&p.kb<=0&&!p.climbLock&&p.mantle<=0;
  const side=canClimb?wallSide(p):0;
  if(canClimb&&side&&dir===side&&p.energy>0){p.cling=true;p.face=side}
  else{
    if(p.cling&&canClimb&&!side&&dir===p.face&&(In.jump||In.up)){p.vy=-175;p.vx=p.face*75;p.mantle=.2;p.coy=0}
    p.cling=false;
  }
  if(p.dashT>0){p.dashT-=dt;p.vx=p.face*250;p.vy=0}
  else if(p.cling){
    const up=In.jump||In.up,dn=In.down&&!up;
    p.vx=p.face*30;p.vy=up?-58:dn?72:0;
    p.energy-=(up||dn?24:6)*dt;p.buf=0;p.air=true;
    if(p.energy<=0){p.energy=0;p.cling=false;p.climbLock=true}
    if(Math.random()<.05)burst(p.x+(p.face>0?10:0),p.y+8,1,'#c8ffe0',20,.25);
  }else{
    if(p.kb<=0&&p.mantle<=0)p.vx=approach(p.vx,dir*spd,(p.ground?1600:1000)*dt);
    p.vy=Math.min(p.vy+GRAV*dt,MAXFALL);
  }
  if(p.ground){p.coy=.09;p.air=true}else p.coy-=dt;
  if(p.buf>0&&!p.cling){
    if(p.coy>0){p.vy=JUMP;p.coy=0;p.buf=0;p.ground=null;p.bounce=false;sfx(420,.12,'square',.04,300)}
    else if(p.abil.dj&&p.air){p.vy=JUMP*.95;p.air=false;p.buf=0;p.bounce=false;burst(p.x+5,p.y+13,10,'#c8ffe0',70,.35);sfx(560,.12,'square',.04,380)}
  }
  if(p.vy>=0)p.bounce=false;
  if(!In.jump&&p.vy<-120&&p.dashT<=0&&!p.bounce&&!p.cling&&p.mantle<=0)p.vy=-120;
  moveBody(p,dt);
  const g=p.ground;
  if(g&&g.tramp&&!p.dead){
    p.vy=-470;p.ground=null;p.bounce=true;p.air=true;p.coy=0;g.sq=.22;
    burst(p.x+5,p.y+13,10,'#ff4fd8',80,.4);sfx(300,.25,'square',.06,700);
  }
  if(g&&!g.plat&&g.w>=3*T&&p.x>g.x+10&&p.x+p.w<g.x+g.w-10)p.safe={x:p.x,y:p.y};
  if(g&&p.vy===0&&p.wasAir){burst(p.x+5,p.y+13,5,'#8c94b8',40,.25)}
  p.wasAir=!g;
  if(p.y>WH+30){
    if(boss.dead&&world.theme===2&&!Hell.on){endWorld2();return}
    if(trySecret())return;
    p.x=p.safe.x;p.y=p.safe.y;p.vx=0;p.vy=0;p.inv=0;
    hurtPlayer(20,p.x+5);P.vy=0;P.vx=0;P.kb=0;
    toast(t('t.fall'),1.4);
  }
  /* shooting */
  const w=ITEMS[Inv.main],chargeable=p.abil.charge&&!w.auto;
  if(p.dashT>0){In.shootHit=false}
  else if(chargeable){
    if(In.shootHit){In.shootHit=false;if(p.shootCd<=0&&bullets.length<14)fireMain(1);p.charge=0}
    if(In.shoot){p.charge=Math.min(2,p.charge+dt)}
    else{if(p.charge>=2)fireMain(5);p.charge=0}
  }else{
    In.shootHit=false;p.charge=0;
    if(In.shoot&&p.shootCd<=0&&bullets.length<14)fireMain(1);
  }
}

/* ---------- projectiles ---------- */
function rocketBoom(b){
  const x=b.x+b.w/2,y=b.y+b.h/2;
  areaDamage(x,y,40,b.dmg,{knock:true,wall:44});
  burst(x,y,22,'#ff6a3d',150,.5);burst(x,y,10,'#fff2c0',100,.35);G.shake=Math.max(G.shake,.2);sfx(90,.35,'sawtooth',.08,-40);
  pboom.push({x:x,y:y,t:.2,small:1});
}
function updateBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.x+=b.vx*dt;if(b.vy)b.y+=b.vy*dt;b.life-=dt;
    let dead=b.life<=0,boom=b.kind==='rk'&&b.life<=0;
    if(!dead){
      const s=solidAt(b.x+(b.vx>0?b.w:0),b.y+b.h/2);
      if(s){dead=true;if(s.brk)brkHit(s,b.kind==='rk'?0:b.dmg);burst(b.x,b.y,4,'#c8ffe0',50,.2);if(b.kind==='rk')boom=true}
    }
    if(!dead){
      for(const e of enemies){
        if(e.spawnT>0||!overlapR(b,e))continue;
        if(b.pierce){
          const last=b.hits.get?b.hits.get(e):(b.hits.has(e)?1e9:undefined);
          if(b.hits.get){if(last!==undefined&&NOW-last<.3)continue;b.hits.set(e,NOW)}
          else{if(b.hits.has(e))continue;b.hits.add(e)}
          if(e.type==='shield'&&b.vx*e.face<0&&b.kind!=='disc'){}
          hitEnemy(e,b.dmg);burst(b.x,b.y,5,'#ffd23f',70,.25);sfx(500,.05,'square',.03,-200);
          continue;
        }
        if(e.type==='shield'&&b.vx*e.face<0&&b.kind!=='rk'){dead=true;burst(b.x,b.y,5,'#35e8ff',70,.25);sfx(1200,.05,'square',.03,-300);e.turnT=0;break}
        if(b.kind==='rk'){dead=true;boom=true;break}
        hitEnemy(e,b.dmg);dead=true;burst(b.x,b.y,5,'#ffd23f',70,.25);sfx(500,.05,'square',.03,-200);
        break;
      }
    }
    if(!dead&&mini&&mini.active&&!mini.dead&&mini.hp>0&&overlapR(b,mini)){
      let ok=true;
      if(b.pierce){
        if(b.hits.get){const l=b.hits.get(mini);if(l!==undefined&&NOW-l<.3)ok=false;else b.hits.set(mini,NOW)}
        else{if(b.hits.has(mini))ok=false;else b.hits.add(mini)}
      }
      if(ok){
        if(b.kind==='rk'){dead=true;boom=true}
        else{mini.hp-=b.dmg;mini.flash=.1;burst(b.x,b.y,6,'#ffd23f',80,.3);sfx(380,.06,'square',.04,-150);if(!b.pierce)dead=true}
      }
    }
    if(!dead&&boss.active&&!boss.dead&&boss.hp>0&&bossHit(b)){
      let ok=true;
      if(b.pierce){
        if(b.hits.get){const l=b.hits.get(boss);if(l!==undefined&&NOW-l<.3)ok=false;else b.hits.set(boss,NOW)}
        else{if(b.hits.has(boss))ok=false;else b.hits.add(boss)}
      }
      if(ok){
        if(b.kind==='rk'){dead=true;boom=true}
        else{boss.hp-=b.dmg;boss.flash=.1;burst(b.x,b.y,6,'#ffd23f',80,.3);sfx(380,.06,'square',.04,-150);if(!b.pierce)dead=true}
      }
    }
    if(dead){if(boom)rocketBoom(b);bullets.splice(i,1)}
  }
  for(let i=ebullets.length-1;i>=0;i--){
    const b=ebullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.g)b.vy+=b.g*dt;b.life-=dt;
    let dead=b.life<=0||pointSolid(b.x,b.y);
    if(!dead&&b.x>P.x-b.r&&b.x<P.x+P.w+b.r&&b.y>P.y-b.r&&b.y<P.y+P.h+b.r){hurtPlayer(b.dmg,b.x);dead=true}
    if(dead){burst(b.x,b.y,5,'#ff2bd6',60,.25);ebullets.splice(i,1)}
  }
}

/* ---------- extra keys ---------- */
window.addEventListener('keydown',e=>{
  const k=e.key;
  if(G.state!=='play')return;
  if(!$('ov').hidden||G.paused){
    if(G.inv&&(k==='i'||k==='I'||k==='Tab')){e.preventDefault();closeInv()}
    return;
  }
  if(k==='e'||k==='E'){if(!e.repeat)In.bombHit=true;return}
  if(k==='q'||k==='Q'){if(!e.repeat)In.secHit=true;return}
  if(k==='r'||k==='R'){if(!e.repeat)tryInteract();return}
  if(k==='i'||k==='I'||k==='Tab'){e.preventDefault();if(!e.repeat)openInv();return}
  if(k==='ArrowDown'||k==='s'||k==='S'){e.preventDefault();In.down=1;return}
  if(k==='ArrowUp'||k==='w'||k==='W')In.up=1;
});
window.addEventListener('keyup',e=>{
  const k=e.key;
  if(k==='ArrowDown'||k==='s'||k==='S')In.down=0;
  if(k==='ArrowUp'||k==='w'||k==='W')In.up=0;
});

/* ---------- vendor ---------- */
function tryInteract(){
  if(G.state!=='play'||G.paused)return;
  if(nearScope()){startScope();return}
  const v=nearVendor();
  if(v)openShop(v);
}
function openShop(v){
  G.paused=true;G.shop=true;Music.stop();
  In.left=In.right=In.jump=In.shoot=In.dash=In.up=In.down=0;
  showShop();
}
function showShop(msg){
  const acts={close:closeInv};
  const left=SHOP_IDS.filter(k=>!Inv.own[k]).length;
  let h='<h2>'+t('shop.title')+'</h2><p>'+(msg||t('shop.hi'))+'</p><p class="dim small">'+t('hud.coins')+': '+Inv.coins+(left?' · '+t('shop.left',left):'')+'</p><div class="menu">';
  SHOP_IDS.forEach(id=>{
    const it=ITEMS[id],own=!!Inv.own[id],ok=Inv.coins>=it.price;
    acts['b:'+id]=()=>buyItem(id);
    h+=btn('<b>'+iname(id)+'</b> · '+(own?t('shop.owned'):t('shop.price',it.price))+'<br><span class="small">'+idesc(id)+'</span>','b:'+id,'slot',own||!ok);
  });
  h+=btn(t('shop.bye'),'close','alt')+'</div>';
  setMenu(h,acts,false,()=>showShop());
}
function buyItem(id){
  const it=ITEMS[id];
  if(Inv.own[id]||Inv.coins<it.price)return;
  Inv.coins-=it.price;Inv.own[id]=1;
  if(it.t==='sec'&&!Inv.sec)Inv.sec=id;
  sfx(780,.2,'triangle',.06,400);
  snap=mkSnap();
  if(Cfg.slot>=0)saveGame(Cfg.slot);
  if(ownsAll()&&!Inv.plate){
    Inv.plate=true;Inv.own.sk_gold=1;Inv.skin='sk_gold';
    sfx(1040,.6,'triangle',.07,500);
    setMenu('<h2>'+t('shop.gift.h')+'</h2><p>'+t('shop.gift.p')+'</p><div class="menu">'+btn(t('shop.bye'),'close')+'</div>',{close:closeInv},false,null);
    return;
  }
  showShop(t('t.bought',iname(id)));
}

  const tree=(x0,w,rw,z)=>{
    const b={x:x0*T,y:rw*T,w:w*T,h:T,row:rw,zone:z,seed:Math.floor(r()*1e6)};
    S.buildings.push(b);S.solids.push(b);

    for(let k=0;k<n;k++)S.decor.push({x:b.x+T*(1+Math.floor(r()*(w-2))),y:b.y,kind:Math.floor(r()*4),seed:Math.floor(r()*1e5)});
    return b;
  };
  let x=12,prevRow=16;

  S.spawn={x:3*T,y:16*T-14};
  S.checks.push({x:6*T,y:16*T-32,w:T,h:32,id:'c0',active:true,spawnX:6*T,spawnY:16*T-14,name:'cp.start'});S.vendors.push({x:9*T,y:16*T,id:'v0'});
  const NZ=S.nz;

    if(z===MINI_Z[2]){const m=buildMini(S,x,2,tree,prevRow);x=m.x;prevRow=m.row;prev=S.buildings[S.buildings.length-1]}
    for(let i=0;i<nB;i++){
      let gap=i===0?2:2+Math.floor(r()*5);
      let w=5+Math.floor(r()*7);if(colAt(S.theme,z,i)>=0)w=Math.max(w,12);
      const ft=featAt(S,z,i);if(ft)w=Math.max(w,featW(ft));
      const isCheck=(i===0&&z>0&&z%3===0),isCluster=(i===4&&z>=2);
      if(isCheck)w=11;
      if(isCluster)w=12;
      let dRow=Math.floor(r()*5)-2;const up=-dRow;
      if(gap>=5&&Math.abs(dRow)>1)dRow=dRow>0?1:-1;
      if(gap<=4&&up>2)dRow=-2;
      let row2=clamp(prevRow+dRow,11,20);
      const set=placeSet(S,z,i,x,prev,prevRow,r,tree);
      if(set){x=set.x;row2=set.row;gap=0;if(set.w)w=set.w}
      else if(gap>=4&&r()<.5){
        const px=(x+Math.floor(gap/2)-1)*T,py=Math.min(prevRow,row2)*T+(r()<.5?0:T);
        const p={x:px,y:py,w:3*T,h:T/2,plat:true};S.plats.push(p);S.solids.push(p);
      }
      x+=gap;
      const b=tree(x,w,row2,z);if(set)setDone(S,b);featureHook(S,b,z,i,nB,isCheck);
      if(ft)addFeat(S,b,ft,z);
      if(isCheck)S.checks.push({x:b.x+5*T,y:b.y-32,w:T,h:32,id:'c'+z,active:false,spawnX:b.x+5*T,spawnY:b.y-14,name:'cp.sector',n:z+1});
      if(i===6&&z>0&&z%2===1)S.pickups.push({id:'hp'+z,kind:'hp',x:b.x+b.w/2-5,y:b.y-14,w:10,h:10});
      const safe=b.colk||isCheck||(z===0&&i<2)||(i===nB-1&&(z===3||z===6))||ft||setSafe(b);
      if(!safe){
        const cxm=b.x+b.w/2,mn=b.x+T,mx=b.x+b.w-T;
        if(z>=1&&w>=7&&r()<.28)S.defs.push({id:nextId++,type:'hopper',x:b.x+T*(2+Math.floor(r()*(w-4))),y:b.y-10,min:mn,max:mx});
        if(isCluster){
          S.defs.push({id:nextId++,type:'shield',x:cxm-8,y:b.y-16,min:mn,max:mx});
          S.defs.push({id:nextId++,type:'scrap',x:b.x+2*T,y:b.y-13,min:mn,max:mx});
          S.defs.push({id:nextId++,type:'scrap',x:b.x+b.w-3*T,y:b.y-13,min:mn,max:mx});
          S.defs.push({id:nextId++,type:'plant',x:b.x+4*T,y:b.y-16});

        }
      }
      prev=b;prevRow=row2;x+=w;
    }
  }
  S.zoneX.push(x*T);x+=2;
  const ap=tree(x,16,16,NZ-1);
  S.checks.push({x:ap.x+8*T,y:ap.y-32,w:T,h:32,id:'cb',active:false,spawnX:ap.x+8*T,spawnY:ap.y-14,name:'cp.boss2'});

}

function makeEnemy2(d){
  if(d.type==='plant')return{id:d.id,type:'plant',x:d.x,y:d.y,w:16,h:16,hp:100,flash:0,t:Math.random()*3,bite:0,biteDone:false};

  if(d.type==='shield')return{id:d.id,type:'shield',x:d.x,y:d.y,w:16,h:16,vx:0,vy:0,hp:120,min:d.min,max:d.max,face:Math.random()<.5?-1:1,dir:1,flash:0,turnT:0,ground:null,anim:0};
  return{id:d.id,type:'bird',x:d.x,y:d.y,w:10,h:8,hp:10,t:0,state:'wait',vx:0,flash:0,face:1,y0:d.y};
}
function updateEnemy(e,dt){
  if(E3[e.type])return E3[e.type](e,dt);
  switch(e.type){
    case'scrap':updateScrap(e,dt);break;
    case'drone':updateDrone(e,dt);break;
    case'plant':updatePlant(e,dt);break;
    case'spitter':updateSpitter(e,dt);break;
    case'shield':updateShield(e,dt);break;
    case'bird':updateBird(e,dt);break;
  }
}
function updatePlant(e,dt){
  e.flash=Math.max(0,e.flash-dt);e.t+=dt;
  const dx=(P.x+5)-(e.x+8),dy=(P.y+6)-(e.y+8);
  if(e.bite<=0&&Math.abs(dx)<30&&Math.abs(dy)<22){e.bite=.5;e.biteDone=false}
  if(e.bite>0){
    e.bite-=dt;
    if(!e.biteDone&&e.bite<.25){
      e.biteDone=true;
      const hb={x:e.x-12,y:e.y-6,w:e.w+24,h:e.h+6};
      if(overlapR(hb,P))hurtPlayer(50,e.x+8);
      sfx(150,.12,'sawtooth',.05,-60);
    }
  }
  if(overlapR(e,P))hurtPlayer(50,e.x+8);
}
function updateSpitter(e,dt){
  e.flash=Math.max(0,e.flash-dt);e.t+=dt;
  const dx=(P.x+5)-e.ox;
  if(Math.abs(dx)<300){
    if(Math.abs(dx)>120)e.ox+=Math.sign(dx)*22*dt;
    else if(Math.abs(dx)<60)e.ox-=Math.sign(dx)*22*dt;
    e.ox=clamp(e.ox,e.hx-150,e.hx+150);
  }
  e.x=e.ox-e.w/2;e.y=e.oy+Math.sin(e.t*2.4)*4;
  e.face=dx>=0?1:-1;
  e.st-=dt;
  const cx=e.x+e.w/2,cy=e.y+e.h/2,pcx=P.x+5,pcy=P.y+6;
  if(e.st<=0){
    e.st=2;
    if(Math.abs(pcx-cx)<240&&Math.abs(pcy-cy)<160){
      const a=Math.atan2(pcy-cy,pcx-cx);
      ebullets.push({x:cx,y:cy,vx:Math.cos(a)*105,vy:Math.sin(a)*105,r:3,dmg:20,life:3,col:'#c8f560'});
      sfx(620,.1,'triangle',.04,-200);
    }
  }
  if(overlapR(e,P))hurtPlayer(20,cx);
}
function updateShield(e,dt){
  e.flash=Math.max(0,e.flash-dt);e.anim+=dt;
  const dx=(P.x+5)-(e.x+8),dy=(P.y+6)-(e.y+8);
  if(Math.abs(dx)<150&&Math.abs(dy)<40){
    const want=dx>=0?1:-1;
    if(want!==e.face){e.turnT+=dt;if(e.turnT>.9){e.face=want;e.turnT=0}}else e.turnT=0;
    e.vx=e.face*14;
  }else{
    e.turnT=0;
    if(e.x<=e.min)e.dir=1;else if(e.x+e.w>=e.max)e.dir=-1;
    e.face=e.dir;e.vx=e.dir*10;
  }
  if(e.x<=e.min&&e.vx<0)e.vx=0;
  if(e.x+e.w>=e.max&&e.vx>0)e.vx=0;
  e.vy=Math.min(e.vy+GRAV*dt,MAXFALL);
  moveBody(e,dt);
  if(overlapR(e,P))hurtPlayer(20,e.x+8);
}
function updateBird(e,dt){
  e.t+=dt;e.flash=Math.max(0,e.flash-dt);

    if(Math.abs(e.x-P.x)<250&&Math.abs(e.y-P.y)<150){e.state='fly';e.face=e.x<P.x?1:-1;e.vx=e.face*85}

  if(Math.abs(e.x-P.x)>430){const i=enemies.indexOf(e);if(i>=0)enemies.splice(i,1);return}

}

function updateFlora(dt){
  const B=boss,A=world.arena,Hs=B.hands;
  if(!B.active||B.dead)return;
  B.flash=Math.max(0,B.flash-dt);
  for(const h of Hs)h.flash=Math.max(0,h.flash-dt);
  const move=(h,k)=>{h.x+=(h.tx-h.x)*Math.min(1,dt*k);h.y+=(h.ty-h.y)*Math.min(1,dt*k)};
  const L0=A.x+40,R0=A.x+A.w-66,pcx=P.x+5;

  if(B.state==='slam'){
    if(B.hi<0)B.hi=Math.abs(pcx-(Hs[0].x+13))<Math.abs(pcx-(Hs[1].x+13))?0:1;
    const h=Hs[B.hi],o=Hs[1-B.hi];
    o.tx=B.hi===0?R0:L0;o.ty=A.roof-26;move(o,4);
    if(B.t<.9){h.tx=clamp(pcx-13,A.x+10,A.x+A.w-36);h.ty=A.roof-130;move(h,5)}

          if(!B.hit&&overlapR(h,P)){B.hit=true;hurtPlayer(30,h.x+13)}
          waves.push({x:h.x+13,dir:-1,life:1.6},{x:h.x+13,dir:1,life:1.6});
        }

    if(B.t>=2.8){B.state='idle';B.cd=1}
  }else if(B.state==='seeds'){
    Hs[0].tx=A.x+A.w/2-70;Hs[1].tx=A.x+A.w/2+44;Hs.forEach(h=>{h.ty=A.roof-96;move(h,5)});

  }else if(B.state==='poison'){

function updateHazards(dt){
  const A=world.arena;if(!A)return;
  for(let i=waves.length-1;i>=0;i--){
    const w=waves[i];w.x+=w.dir*130*dt;w.life-=dt;
