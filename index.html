function buildLevel2(){
  resetWorld();nextId=1;
  const r=mulberry32(77012026),S=world;
  S.theme=2;S.nz=10;S.names=NAMES2;S.pals=PALS2;initFeatures(S);
  const tree=(x0,w,rw,z)=>{
    const b={x:x0*T,y:rw*T,w:w*T,h:T,row:rw,zone:z,seed:Math.floor(r()*1e6)};
    S.buildings.push(b);S.solids.push(b);
    const n=Math.floor(w/3);
    for(let k=0;k<n;k++)S.decor.push({x:b.x+T*(1+Math.floor(r()*(w-2))),y:b.y,kind:Math.floor(r()*4),seed:Math.floor(r()*1e5)});
    return b;
  };
  let x=12,prevRow=16;
  tree(0,12,16,0);
  S.spawn={x:3*T,y:16*T-14};
  S.checks.push({x:6*T,y:16*T-32,w:T,h:32,id:'c0',active:true,spawnX:6*T,spawnY:16*T-14,name:'cp.start'});S.vendors.push({x:9*T,y:16*T,id:'v0'});
  const NZ=S.nz;
  for(let z=0;z<NZ;z++){
    const d=z/(NZ-1);S.zoneX.push(x*T);
    const nB=10+(z%2);
    if(z===MINI_Z[2]){const m=buildMini(S,x,2,tree,prevRow);x=m.x;prevRow=m.row}
    for(let i=0;i<nB;i++){
      const gap=i===0?2:2+Math.floor(r()*5);
      let w=5+Math.floor(r()*7);if(colAt(S.theme,z,i)>=0)w=Math.max(w,12);
      const isCheck=(i===0&&z>0&&z%3===0),isCluster=(i===4&&z>=2);
      if(isCheck)w=11;
      if(isCluster)w=12;
      let dRow=Math.floor(r()*5)-2;const up=-dRow;
      if(gap>=5&&Math.abs(dRow)>1)dRow=dRow>0?1:-1;
      if(gap<=4&&up>2)dRow=-2;
      const row2=clamp(prevRow+dRow,11,20);
      if(gap>=4&&r()<.5){
        const px=(x+Math.floor(gap/2)-1)*T,py=Math.min(prevRow,row2)*T+(r()<.5?0:T);
        const p={x:px,y:py,w:3*T,h:T/2,plat:true};S.plats.push(p);S.solids.push(p);
      }
      x+=gap;
      const b=tree(x,w,row2,z);featureHook(S,b,z,i,nB,isCheck);
      if(isCheck)S.checks.push({x:b.x+5*T,y:b.y-32,w:T,h:32,id:'c'+z,active:false,spawnX:b.x+5*T,spawnY:b.y-14,name:'cp.sector',n:z+1});
      if(i===6&&z>0&&z%2===1)S.pickups.push({id:'hp'+z,kind:'hp',x:b.x+b.w/2-5,y:b.y-14,w:10,h:10});
      const safe=b.colk||isCheck||(z===0&&i<2)||(i===nB-1&&(z===3||z===6));
      if(!safe){
        const cxm=b.x+b.w/2,mn=b.x+T,mx=b.x+b.w-T;
        if(isCluster){
          S.defs.push({id:nextId++,type:'shield',x:cxm-8,y:b.y-16,min:mn,max:mx});
          S.defs.push({id:nextId++,type:'scrap',x:b.x+2*T,y:b.y-13,min:mn,max:mx});
          S.defs.push({id:nextId++,type:'scrap',x:b.x+b.w-3*T,y:b.y-13,min:mn,max:mx});
          S.defs.push({id:nextId++,type:'plant',x:b.x+4*T,y:b.y-16});
          S.defs.push({id:nextId++,type:'spitter',x:cxm,y:b.y-62});
        }else{
          if(w>=6&&r()<.3+.15*d)S.defs.push({id:nextId++,type:'scrap',x:b.x+T*(2+Math.floor(r()*(w-4))),y:b.y-13,min:mn,max:mx});
          if(w>=8&&r()<.32+.2*d)S.defs.push({id:nextId++,type:'plant',x:b.x+T*(3+Math.floor(r()*(w-6))),y:b.y-16});
          if(r()<.28+.2*d)S.defs.push({id:nextId++,type:'spitter',x:cxm+(r()-.5)*T*3,y:b.y-56-Math.floor(r()*30)});
          if(r()<.22)S.defs.push({id:nextId++,type:'bird',x:cxm,y:b.y-50-Math.floor(r()*50)});
        }
      }
      prevRow=row2;x+=w;
    }
  }
  S.zoneX.push(x*T);x+=2;
  const ap=tree(x,16,16,NZ-1);
  S.checks.push({x:ap.x+8*T,y:ap.y-32,w:T,h:32,id:'cb',active:false,spawnX:ap.x+8*T,spawnY:ap.y-14,name:'cp.boss2'});
  S.pickups.push({id:'hpb',kind:'hp',x:ap.x+11*T,y:ap.y-14,w:10,h:10});
  x+=16;
  const arenaW=26,ar=tree(x,arenaW,16,NZ-1);
  S.arena={x:ar.x,y:ar.y,w:arenaW*T,roof:ar.y,trigger:ar.x+3*T,bld:ar};
  S.bossX=ar.x;
  S.door={x:ar.x-T,y:0,w:T,h:ROWS*T,closed:false,solid:true};
  S.exitWall={x:ar.x+arenaW*T,y:0,w:T,h:ROWS*T,solid:true};
  S.solids.push(S.exitWall);
  S.beacon=null;
  S.endX=ar.x+arenaW*T+T*3;
  S.solids.push({x:-T,y:0,w:T,h:ROWS*T});
  S.solids.push({x:S.endX-T,y:0,w:T,h:ROWS*T});
}

function makeEnemy2(d){

  if(d.type==='shield')return{id:d.id,type:'shield',x:d.x,y:d.y,w:16,h:16,vx:0,vy:0,hp:120,min:d.min,max:d.max,face:Math.random()<.5?-1:1,dir:1,flash:0,turnT:0,ground:null,anim:0};
  return{id:d.id,type:'bird',x:d.x,y:d.y,w:10,h:8,hp:10,t:0,state:'wait',vx:0,flash:0,face:1,y0:d.y};
}
function updateEnemy(e,dt){
  if(E3[e.type])return E3[e.type](e,dt);
  switch(e.type){
    case'scrap':updateScrap(e,dt);break;
    case'drone':updateDrone(e,dt);break;
    case'plant':updatePlant(e,dt);break;
    case'spitter':updateSpitter(e,dt);break;
    case'shield':updateShield(e,dt);break;
    case'bird':updateBird(e,dt);break;
  }
}
function updatePlant(e,dt){

function updateSpitter(e,dt){
  e.flash=Math.max(0,e.flash-dt);e.t+=dt;
  const dx=(P.x+5)-e.ox;
  if(Math.abs(dx)<300){
    if(Math.abs(dx)>120)e.ox+=Math.sign(dx)*22*dt;
    else if(Math.abs(dx)<60)e.ox-=Math.sign(dx)*22*dt;
    e.ox=clamp(e.ox,e.hx-150,e.hx+150);
  }
  e.x=e.ox-e.w/2;e.y=e.oy+Math.sin(e.t*2.4)*4;
  e.face=dx>=0?1:-1;
  e.st-=dt;
  const cx=e.x+e.w/2,cy=e.y+e.h/2,pcx=P.x+5,pcy=P.y+6;
  if(e.st<=0){
    e.st=2;

      const a=Math.atan2(pcy-cy,pcx-cx);
      ebullets.push({x:cx,y:cy,vx:Math.cos(a)*105,vy:Math.sin(a)*105,r:3,dmg:20,life:3,col:'#c8f560'});

    }

function updateShield(e,dt){
  e.flash=Math.max(0,e.flash-dt);e.anim+=dt;
  const dx=(P.x+5)-(e.x+8),dy=(P.y+6)-(e.y+8);
  if(Math.abs(dx)<150&&Math.abs(dy)<40){
    const want=dx>=0?1:-1;
    if(want!==e.face){e.turnT+=dt;if(e.turnT>.9){e.face=want;e.turnT=0}}else e.turnT=0;
    e.vx=e.face*14;
  }else{
    e.turnT=0;
    if(e.x<=e.min)e.dir=1;else if(e.x+e.w>=e.max)e.dir=-1;
    e.face=e.dir;e.vx=e.dir*10;
  }
  if(e.x<=e.min&&e.vx<0)e.vx=0;
  if(e.x+e.w>=e.max&&e.vx>0)e.vx=0;
  e.vy=Math.min(e.vy+GRAV*dt,MAXFALL);
  moveBody(e,dt);
  if(overlapR(e,P))hurtPlayer(20,e.x+8);
}
function updateBird(e,dt){
  e.t+=dt;e.flash=Math.max(0,e.flash-dt);
  if(e.state==='wait'){
    if(Math.abs(e.x-P.x)<250&&Math.abs(e.y-P.y)<150){e.state='fly';e.face=e.x<P.x?1:-1;e.vx=e.face*85}
    return;
  }
  e.x+=e.vx*dt;e.y=e.y0+Math.sin(e.t*5)*8;
  if(Math.abs(e.x-P.x)>430){const i=enemies.indexOf(e);if(i>=0)enemies.splice(i,1);return}

}

function updateHazards(dt){
  const A=world.arena;if(!A)return;
  for(let i=waves.length-1;i>=0;i--){
    const w=waves[i];w.x+=w.dir*130*dt;w.life-=dt;
    if(overlapR({x:w.x-5,y:A.roof-8,w:10,h:8},P))hurtPlayer(20,w.x);
    if(w.life<=0||w.x<A.x+4||w.x>A.x+A.w-4)waves.splice(i,1);
  }
  for(let i=seeds.length-1;i>=0;i--){
    const s=seeds[i];s.life-=dt;s.vy+=520*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;
    let dead=s.life<=0;
    if(s.x<A.x+8){s.x=A.x+8;s.vx=Math.abs(s.vx)}
    if(s.x>A.x+A.w-8){s.x=A.x+A.w-8;s.vx=-Math.abs(s.vx)}
    if(s.y>=A.roof-4){
      s.y=A.roof-4;
      if(s.b>=3)dead=true;
      else{s.b++;s.vy=-Math.max(170,Math.abs(s.vy)*.85);sfx(300+s.b*80,.05,'sine',.03,100)}
    }
    if(!dead&&s.x>P.x-4&&s.x<P.x+P.w+4&&s.y>P.y-4&&s.y<P.y+P.h+4){hurtPlayer(20,s.x);dead=true}
    if(dead){burst(s.x,s.y,5,'#c8f560',60,.3);seeds.splice(i,1)}
  }
  let inPoison=false;
  for(let i=puddles.length-1;i>=0;i--){
    const p=puddles[i];p.t+=dt;
    if(p.t>.5&&overlapR(P,{x:p.x,y:A.roof-14,w:p.w,h:14}))inPoison=true;
    if(p.t>=p.life)puddles.splice(i,1);
  }
  if(inPoison){
    P.poisonT-=dt;
    if(P.poisonT<=0&&P.inv<=0&&P.dashT<=0){hurtPlayer(10,P.x+5,true);P.poisonT=2;toast(t('t.poison'),1)}
  }else P.poisonT=0;
  for(let i=thorns.length-1;i>=0;i--){
    const t=thorns[i];t.t+=dt;

    if(t.t===dt||(t.t>=.9&&t.t-dt<.9))sfx(220,.15,'sawtooth',.04,200);
    if(t.t>1.5)thorns.splice(i,1);
  }
}

function makeForest(wid,hei,seed,minH,maxH,cr){
  const c=document.createElement('canvas');c.width=wid;c.height=hei;const g=c.getContext('2d'),r=mulberry32(seed);
  g.fillStyle='#fff';
  let x=50;
  while(x<wid-60){
    const h=minH+r()*(maxH-minH),tw=6+Math.floor(r()*6),rad=cr*(.7+r()*.6);
    g.fillRect(x,hei-h,tw,h);
    for(let k=0;k<5;k++){g.beginPath();g.arc(x+tw/2+(r()-.5)*rad*1.6,hei-h-(r()*.5)*rad+rad*.2,rad*(.6+r()*.5),0,6.283);g.fill()}
    x+=tw+20+Math.floor(r()*44);
  }
  return c;
}

/* bosses already beaten in Boss Hell, in the order they sit in the stand */
function hellBench(){
  if(!Hell.on||!boss)return[];
  if(boss.kind==='duo')return['colossus','flora','centaur','unity'];
  const order=['colossus','flora','centaur','bonez','unity'];
  let n=[0,1,2,4][Hell.i]||0;
  if(boss.kind==='bonez'||boss.kind==='tram')n++;

  return order.slice(0,Math.min(5,n));
}

let tcirc=[];
function updateCirc(dt){
  const A=world.arena;if(!A)return;
  if(P.slowT>0)P.slowT-=dt;
  for(let i=tcirc.length-1;i>=0;i--){
    const o=tcirc[i];
    if(o.k==='ball'){
      o.vy+=700*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;o.rot+=o.vx*dt/o.r;
      if(o.y+o.r>=A.roof&&o.vy>0){o.y=A.roof-o.r;o.vy=-Math.max(170,Math.abs(o.vy)*.78);sfx(150,.08,'square',.03,-60)}
      const dx=(P.x+5)-o.x,dy=(P.y+6)-o.y;
      if(!o.hit&&dx*dx+dy*dy<(o.r+6)*(o.r+6)){o.hit=true;hurtPlayer(25,o.x)}
      if(o.x<A.lx-30||o.x>A.rx+30)tcirc.splice(i,1);
    }else if(o.k==='hoop'){
      o.x+=o.vx*dt;
      if(!o.hit&&!o.pass&&Math.abs(P.x+5-o.x)<6){
        const top=o.y-o.r+4,bot=o.y+o.r-4;
        if(P.y<top||P.y+P.h>bot){o.hit=true;hurtPlayer(20,o.x)}
        else{o.pass=true;sfx(880,.15,'triangle',.05,400);burst(o.x,o.y,10,'#ffd23f',90,.4)}
      }
      if(o.x<A.lx-30||o.x>A.rx+30)tcirc.splice(i,1);
    }else if(o.k==='pie'){
      o.vy+=600*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;
      if(o.x>P.x-3&&o.x<P.x+P.w+3&&o.y>P.y-3&&o.y<P.y+P.h+3){hurtPlayer(10,o.x);P.slowT=2;burst(o.x,o.y,10,'#fff8f0',80,.4);tcirc.splice(i,1);continue}
      if(o.y>=A.roof-3){tcirc.splice(i,1);tcirc.push({k:'cream',x:o.x,w:22,t:4});burst(o.x,A.roof-3,8,'#fff8f0',70,.3);sfx(200,.1,'triangle',.04,-100)}

    }
  }
}
